<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>קניות הבית</title>
<meta name="theme-color" content="#eef2e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141912" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="קניות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column; a month navigator on top, then the month's progress, then store sections in walking order */
:root {
  color-scheme: light;
  --bg: #eef2e9;
  --surface: #ffffff;
  --ink: #1f2a1c;
  --muted: #687262;
  --line: #dde3d5;
  --accent: #3e6b2c;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecd9;
  --done: #a2aa9b;
  --warn: #9a4a1c;
  --veg: #4f8a34; --dairy: #4a7fb0; --meat: #b5473a; --dry: #b88a2e; --bread: #a8693a; --spice: #7a5aa6; --other: #6f7a6a;
  --f-display: "Rubik", "Assistant", system-ui, sans-serif;
  --f-body: "Assistant", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141912; --surface: #1d241a; --ink: #e6ebe1; --muted: #9aa494; --line: #2d3629;
    --accent: #8fc46f; --accent-ink: #102009; --accent-soft: #263420; --done: #5d6658; --warn: #e39a6c;
    --veg: #8fc46f; --dairy: #82b4e2; --meat: #e9867a; --dry: #e0b860; --bread: #d89a68; --spice: #b79ae0; --other: #a2ad9c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141912; --surface: #1d241a; --ink: #e6ebe1; --muted: #9aa494; --line: #2d3629;
  --accent: #8fc46f; --accent-ink: #102009; --accent-soft: #263420; --done: #5d6658; --warn: #e39a6c;
  --veg: #8fc46f; --dairy: #82b4e2; --meat: #e9867a; --dry: #e0b860; --bread: #d89a68; --spice: #b79ae0; --other: #a2ad9c;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

header { background: var(--bg); padding-block: 18px 12px; display: grid; gap: 10px; }
.bell { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: .85rem; }
.bell.on { border-color: var(--line); color: var(--muted); }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.55rem; letter-spacing: -.01em; text-wrap: balance; }
.month { font-size: .9rem; color: var(--muted); font-weight: 600; }
.progress { display: grid; gap: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
.stats { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 700; }

.add { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.add input, .add select { min-width: 0; height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; }
.add select { padding-inline: 10px 6px; max-width: 130px; }
.add button { height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.add :disabled { opacity: .5; cursor: not-allowed; }
.hint { font-size: .8rem; color: var(--muted); margin-top: -4px; }

.filters { display: flex; gap: 6px; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 14px; font-size: .9rem; font-weight: 600; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

main { display: grid; gap: 14px; margin-top: 6px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.sec h2 { margin: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; font-family: var(--f-display); font-size: 1rem; font-weight: 600; border-bottom: 1px solid var(--line); }
.sec h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.sec h2 .cnt { margin-inline-start: auto; font-family: var(--f-body); font-size: .85rem; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.sec ul { list-style: none; margin: 0; padding: 0; }
.it { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
.it:first-child { border-top: 0; }
.chk { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; text-align: start; padding: 12px 16px; min-height: 52px; }
.box { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid var(--c); display: grid; place-items: center; transition: background .15s; }
.box svg { width: 14px; height: 14px; opacity: 0; }
.name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.it.done .box { background: var(--c); }
.it.done .box svg { opacity: 1; }
.it.done .name { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.del { flex: none; width: 44px; height: 44px; margin-inline-end: 6px; border: 0; background: none; color: var(--muted); border-radius: 10px; font-size: 1.3rem; line-height: 1; opacity: .55; }
.del:hover { opacity: 1; background: var(--accent-soft); }
.box svg path { stroke: var(--surface); }

.state { text-align: center; color: var(--muted); padding: 36px 12px; display: grid; gap: 6px; }
.state strong { color: var(--ink); font-family: var(--f-display); font-size: 1.1rem; }
.note { font-size: .88rem; color: var(--warn); text-align: center; }
.ro { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: .9rem; }

.curtop { display: grid; gap: 10px; }
.nav { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 5px; }
.nav > button { width: 42px; height: 42px; flex: none; border: 0; background: var(--bg); border-radius: 10px; font-size: 1.15rem; font-weight: 700; color: var(--ink); }
.nav > button:disabled { opacity: .3; cursor: default; }
.navlbl { flex: 1; min-width: 0; display: grid; justify-items: center; line-height: 1.15; }
.navlbl b { font-family: var(--f-display); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.navlbl small { font-size: .75rem; color: var(--muted); font-weight: 600; }
.navlbl small.now { color: var(--accent); }
.today { justify-self: center; border: 0; background: none; color: var(--accent); font-weight: 700; font-size: .85rem; padding: 0 8px; margin-top: -4px; text-decoration: underline; text-underline-offset: 3px; }
.create { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.create strong { font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; }
.create p { margin: 0; color: var(--muted); font-size: .92rem; }
.create .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.create button { height: 42px; border-radius: 10px; padding: 0 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
.create button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.create button:disabled { opacity: .5; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px 10px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.filters .pickbtn { margin-inline-start: auto; border-color: var(--accent); color: var(--accent); background: transparent; }
.picker { display: grid; gap: 14px; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.phead strong { font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; }
.phead .pbtns { display: flex; gap: 6px; }
.phead button, .pbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: .9rem; }
.it.have .name { color: var(--done); }
.it.have .tag { margin-inline-start: auto; font-size: .78rem; color: var(--muted); padding-inline-end: 16px; }
.pbar { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.pbar .go { flex: 1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; height: 44px; }
.pbar .go:disabled { opacity: .45; }
.pbar button { height: 44px; }
.defnote { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: .9rem; }
.toast { position: fixed; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 20; }
.toast[hidden] { display: none; }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 0; }
@media (prefers-reduced-motion: reduce) { .bar i, .box { transition: none; } }
@media (max-width: 400px) { .add { grid-template-columns: minmax(0, 1fr) auto; } .add select { grid-column: 1 / -1; grid-row: 2; max-width: none; } .add button { grid-row: 1; grid-column: 2; } }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db.js"></script>
</head>
<body>


<div class="wrap" dir="rtl" lang="he">
  <header>
    <div class="titlerow">
      <h1>רשימת הקניות של הבית</h1>
      <button type="button" class="bell" id="notifBtn" hidden>הפעלת התראות</button>
    </div>
    <div class="tabs" role="tablist" aria-label="תצוגה">
      <button type="button" role="tab" id="tMonth" aria-selected="true">רשימה חודשית</button>
      <button type="button" role="tab" id="tDef" aria-selected="false">רשימת ברירת מחדל</button>
    </div>
    <div class="nav" id="navBar">
      <button type="button" id="prev" aria-label="לחודש הקודם">→</button>
      <div class="navlbl"><b id="mLabel"></b><small id="mSub"></small></div>
      <button type="button" id="next" aria-label="לחודש הבא">←</button>
    </div>
    <button type="button" class="today" id="today" hidden>חזרה לחודש הנוכחי</button>
    <div class="curtop" id="curTop">
    <div class="progress" id="prog">
      <div class="bar"><i id="barFill"></i></div>
      <div class="stats"><span>נקנו <b id="nDone">0</b> מתוך <b id="nAll">0</b></span><span id="nLeft"></span></div>
    </div>
    <form class="add" id="addForm" autocomplete="off">
      <input id="addName" type="text" placeholder="מה להוסיף? למשל: חלב, ביצים" aria-label="שם המוצר">
      <select id="addDept" aria-label="מחלקה"></select>
      <button type="submit" id="addBtn">הוספה</button>
    </form>
    <div class="hint" id="hint">אפשר להוסיף כמה מוצרים בבת אחת, מופרדים בפסיק.</div>
    <div class="filters" id="filt" role="group" aria-label="סינון">
      <button type="button" id="fAll" aria-pressed="true">הכול</button>
      <button type="button" id="fLeft" aria-pressed="false">נשאר לקנות</button>
      <button type="button" class="pickbtn" id="pickBtn">+ מברירת המחדל</button>
    </div>
    </div>
    <div class="ro" id="roNote" hidden></div>
    <div class="note" id="netNote" hidden></div>
  </header>

  <main id="list">
    <div class="state" id="loading"><strong>טוען את הרשימה…</strong><span>המוצרים יופיעו כאן לפי מחלקות בסופר.</span></div>
  </main>


</div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>ביטול</button></div>

<script>
(() => {
  const DEPTS = [
    { k: "veg", n: "ירקות ופירות" },
    { k: "dairy", n: "מוצרי חלב וביצים" },
    { k: "meat", n: "בשר, עוף ודגים" },
    { k: "dry", n: "יבשים ושימורים" },
    { k: "bread", n: "לחם ומאפים" },
    { k: "spice", n: "שמנים ותבלינים" },
    { k: "other", n: "אחר" },
  ];
  const DEPT_NAME = Object.fromEntries(DEPTS.map(d => [d.k, d.n]));
  const TZ = "Asia/Jerusalem";
  const MAX_AHEAD = 12;

  const $ = id => document.getElementById(id);
  const els = { list: $("list"), bar: $("barFill"), nDone: $("nDone"), nAll: $("nAll"), nLeft: $("nLeft"),
    form: $("addForm"), name: $("addName"), dept: $("addDept"), addBtn: $("addBtn"), fAll: $("fAll"), fLeft: $("fLeft"),
    ro: $("roNote"), net: $("netNote"), toast: $("toast"), toastMsg: $("toastMsg"), toastUndo: $("toastUndo"),
    prev: $("prev"), next: $("next"), mLabel: $("mLabel"), mSub: $("mSub"), today: $("today"), curTop: $("curTop") };

  Object.assign(els, { tMonth: $("tMonth"), tDef: $("tDef"), navBar: $("navBar"), prog: $("prog"), hint: $("hint"), filt: $("filt"), pickBtn: $("pickBtn") });
  const HOLDER = "v-" + Math.random().toString(36).slice(2);
  const fmtMonth = k => { const [y, m] = String(k).split("-").map(Number); return String(m).padStart(2, "0") + "/" + String(y).slice(-2); };
  const addMonths = (k, n) => { const [y, m] = k.split("-").map(Number); const t = y * 12 + (m - 1) + n; return Math.floor(t / 12) + "-" + String(t % 12 + 1).padStart(2, "0"); };
  function monthKey(d = new Date()) {
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit" }).formatToParts(d);
    return p.find(x => x.type === "year").value + "-" + p.find(x => x.type === "month").value;
  }
  const curMonth = monthKey();
  const maxMonth = addMonths(curMonth, MAX_AHEAD);
  const isMonth = k => /^\d{4}-(0[1-9]|1[0-2])$/.test(k);

  const DEVICE = window.DEVICE_ID || "unknown";
  const state = {
    db: null, canWrite: true, filter: "all",
    sel: curMonth, navigated: false,
    months: new Set(), monthsLoaded: false,
    items: new Map(), loaded: false, unsub: null, creating: false,
    view: "month", defaults: new Map(), defLoaded: false, picking: false, pickSel: new Set(), adding: false,
  };
  try { const s = localStorage.getItem("selMonth"); if (isMonth(s) && s <= maxMonth) { state.sel = s; state.navigated = true; } } catch (e) {}

  // department select, remembering the last one used on this device
  let lastDept = "veg";
  try { lastDept = localStorage.getItem("lastDept") || "veg"; } catch (e) {}
  els.dept.innerHTML = DEPTS.map(d => `<option value="${d.k}">${d.n}</option>`).join("");
  els.dept.value = DEPT_NAME[lastDept] ? lastDept : "veg";

  // ---------- toast ----------
  let toastTimer = null, undoFn = null;
  function toast(msg, undo) {
    els.toastMsg.textContent = msg;
    undoFn = undo || null;
    els.toastUndo.hidden = !undo;
    els.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { els.toast.hidden = true; undoFn = null; }, undo ? 5000 : 2800);
  }
  els.toastUndo.addEventListener("click", () => { const f = undoFn; els.toast.hidden = true; undoFn = null; if (f) f(); });

  // ---------- month navigation ----------
  const earliest = () => { const a = [...state.months].sort(); return a.length ? a[0] : curMonth; };
  const monthExists = m => state.months.has(m) || (m === state.sel && state.items.size > 0);
  function sourceFor(m) {
    const a = [...state.months].filter(x => x !== m).sort();
    const before = a.filter(x => x < m);
    return before.length ? before[before.length - 1] : (a.length ? a[0] : null);
  }

  function renderNav() {
    const m = state.sel;
    els.mLabel.textContent = fmtMonth(m);
    els.mSub.textContent = m === curMonth ? "החודש" : m < curMonth ? "חודש שעבר" : "קנייה עתידית";
    els.mSub.className = m === curMonth ? "now" : "";
    const low = [earliest(), curMonth].sort()[0];
    els.prev.disabled = m <= low;
    els.next.disabled = m >= maxMonth;
    els.today.hidden = m === curMonth || state.view !== "month";
  }

  function selectMonth(m, byUser) {
    if (!isMonth(m)) return;
    if (byUser) { state.navigated = true; try { localStorage.setItem("selMonth", m); } catch (e) {} }
    if (m === state.sel && state.unsub) { renderNav(); return; }
    state.sel = m;
    state.picking = false; state.pickSel.clear();
    renderNav();
    subscribeItems();
  }
  els.prev.addEventListener("click", () => selectMonth(addMonths(state.sel, -1), true));
  els.next.addEventListener("click", () => selectMonth(addMonths(state.sel, 1), true));
  els.today.addEventListener("click", () => selectMonth(curMonth, true));

  // ---------- render ----------
  const CHECK = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function render() {
    if (state.view === "defaults") { renderDefaults(); return; }
    const all = [...state.items.values()];
    const done = all.filter(i => i.done).length;
    els.nDone.textContent = done;
    els.nAll.textContent = all.length;
    els.nLeft.textContent = all.length ? (all.length - done ? "נשארו " + (all.length - done) : "הכול נקנה") : "";
    els.bar.style.width = all.length ? (done / all.length * 100) + "%" : "0";
    if (!state.loaded) return;
    if (state.picking) { renderPicker(); return; }

    if (!all.length) {
      const m = state.sel;
      const src = sourceFor(m);
      if (!state.months.has(m) && state.canWrite && state.db) {
        els.list.innerHTML = `<div class="create">
          <strong>אין עדיין רשימה ל-${fmtMonth(m)}</strong>
          <p>בוחרים מוצרים מרשימת ברירת המחדל${src ? `, מעתיקים את הרשימה של ${fmtMonth(src)} בלי הסימונים,` : ""} או מתחילים רשימה ריקה.</p>
          <div class="btns">
            <button type="button" class="go" data-pick ${state.creating ? "disabled" : ""}>בחירה מברירת המחדל</button>
            ${src ? `<button type="button" data-create="${src}" ${state.creating ? "disabled" : ""}>העתקה מ-${fmtMonth(src)}</button>` : ""}
            <button type="button" data-create="" ${state.creating ? "disabled" : ""}>רשימה ריקה</button>
          </div></div>`;
      } else {
        els.list.innerHTML = `<div class="state"><strong>הרשימה של ${fmtMonth(m)} ריקה</strong><span>${state.canWrite ? "מוסיפים מוצר בשורה למעלה, והוא יופיע כאן במחלקה שלו." : "עוד לא נוספו מוצרים לחודש הזה."}</span></div>`;
      }
      return;
    }
    const coll = new Intl.Collator("he");
    let html = "";
    for (const d of DEPTS) {
      let items = all.filter(i => (DEPT_NAME[i.dept] ? i.dept : "other") === d.k);
      if (!items.length) continue;
      const left = items.filter(i => !i.done).length;
      if (state.filter === "left") items = items.filter(i => !i.done);
      if (!items.length) continue;
      items.sort((a, b) => (a.done - b.done) || coll.compare(a.name, b.name));
      html += `<section class="sec" style="--c: var(--${d.k})"><h2><span class="dot"></span>${d.n}<span class="cnt">${left ? left + " לקנות" : "✓"}</span></h2><ul>`;
      for (const i of items) {
        html += `<li class="it${i.done ? " done" : ""}" data-id="${esc(i.id)}">
          <button type="button" class="chk" role="checkbox" aria-checked="${i.done}" ${state.canWrite ? "" : "disabled"}><span class="box">${CHECK}</span><span class="name">${esc(i.name)}</span></button>
          ${state.canWrite ? `<button type="button" class="del" aria-label="מחיקת ${esc(i.name)}">×</button>` : ""}
        </li>`;
      }
      html += "</ul></section>";
    }
    els.list.innerHTML = html || '<div class="state"><strong>הכול נקנה</strong><span>אין מוצרים שנשארו לקנות ברשימה הזו.</span></div>';
  }

  function setWritable(can) {
    state.canWrite = can;
    els.ro.hidden = can;
    [els.name, els.dept, els.addBtn].forEach(e => e.disabled = !can);
    els.pickBtn.hidden = !can;
    render();
  }

  // ---------- writes ----------
  function onWriteError(e) {
    if (e && e.code === "permission-denied") { toast("אין גישה לרשימה. פתחו את האפליקציה מהקישור המשפחתי."); return; }
    if (e && e.code === "resource-exhausted") { toast("הרשימה מלאה. מחקו כמה מוצרים ונסו שוב."); return; }
    toast("השינוי לא נשמר. בדקו את החיבור ונסו שוב.");
  }

  async function registerMonth(m, from) {
    if (state.months.has(m)) return;
    await state.db.doc("months/" + m).set({ created: Date.now(), from: from || null });
    state.months.add(m);
    renderNav();
  }

  const pending = new Set();
  async function toggle(id) {
    const it = state.items.get(id);
    if (!it || pending.has(id) || !state.db) return;
    pending.add(id);
    try { await state.db.doc("items/" + id).update({ done: !it.done, boughtAt: it.done ? null : Date.now() }); }
    catch (e) { onWriteError(e); }
    finally { pending.delete(id); }
  }

  async function removeItem(id) {
    const it = state.items.get(id);
    if (!it || !state.db) return;
    const body = { month: it.month, name: it.name, dept: it.dept, done: it.done, boughtAt: it.boughtAt, created: it.created || Date.now() };
    try {
      await state.db.doc("items/" + id).delete();
      toast("״" + it.name + "״ נמחק", async () => {
        try { await state.db.doc("items/" + id).set(body); } catch (e) { onWriteError(e); }
      });
    } catch (e) { onWriteError(e); }
  }

  async function addItems(text, dept) {
    const names = text.split(/[,،\n]/).map(s => s.trim().replace(/\s+/g, " ")).filter(Boolean);
    if (!names.length || !state.db) return;
    const m = state.sel;
    const byName = new Map([...state.items.values()].map(i => [i.name, i]));
    let added = 0, revived = 0, already = 0;
    const addedNames = [];
    try { await registerMonth(m, null); } catch (e) { onWriteError(e); return; }
    for (const n of names.slice(0, 40)) {
      const ex = byName.get(n);
      try {
        if (ex) {
          if (ex.done) { await state.db.doc("items/" + ex.id).update({ done: false, boughtAt: null }); revived++; }
          else already++;
        } else {
          await state.db.collection("items").add({ month: m, name: n.slice(0, 60), dept, done: false, boughtAt: null, created: Date.now(), by: DEVICE, notified: false });
          byName.set(n, { done: false }); added++; addedNames.push(n.slice(0, 60));
        }
      } catch (e) { onWriteError(e); return; }
    }
    queueNotify(m, addedNames);
    const parts = [];
    if (added) parts.push(added === 1 ? "נוסף מוצר ל-" + fmtMonth(m) : "נוספו " + added + " מוצרים ל-" + fmtMonth(m));
    if (revived) parts.push(revived === 1 ? "מוצר אחד חזר לרשימה" : revived + " מוצרים חזרו לרשימה");
    if (already) parts.push(already === 1 ? "מוצר אחד כבר ברשימה" : already + " כבר ברשימה");
    toast(parts.join(" · "));
  }

  // new month: copy every product from another month, unticked
  async function createMonth(m, src) {
    if (state.creating || !state.db) return;
    state.creating = true; render();
    try {
      const ref = state.db.doc("months/" + m);
      const lease = await ref.acquire({ holder: HOLDER, ttlMs: 60000 });
      if (!lease.acquired) { toast("מישהו אחר יוצר את הרשימה הזו עכשיו."); return; }
      const fresh = await ref.get();
      if (fresh.exists && fresh.data().created) { state.months.add(m); return; }
      let copied = 0;
      if (src) {
        const [srcSnap, curSnap] = await Promise.all([
          state.db.collection("items").where("month", "==", src).get(),
          state.db.collection("items").where("month", "==", m).get(),
        ]);
        const have = new Set(curSnap.docs.map(d => (d.data() || {}).name));
        const todo = srcSnap.docs.map(d => d.data() || {}).filter(x => x.name && !have.has(x.name));
        const now = Date.now();
        for (let i = 0; i < todo.length; i += 4) {
          await Promise.all(todo.slice(i, i + 4).map(x =>
            state.db.collection("items").add({ month: m, name: String(x.name), dept: String(x.dept || "other"), done: false, boughtAt: null, created: now, by: DEVICE, notified: false })));
          copied += Math.min(4, todo.length - i);
        }
      }
      await ref.set({ created: Date.now(), from: src || null });
      state.months.add(m);
      toast(src ? "נוצרה רשימה ל-" + fmtMonth(m) + " עם " + copied + " מוצרים" : "נוצרה רשימה ריקה ל-" + fmtMonth(m));
    } catch (e) { onWriteError(e); }
    finally { state.creating = false; renderNav(); render(); }
  }

  // ---------- default list ----------
  const SEED = [["b01", "טורטיות", "bread"], ["b02", "פיתות", "bread"], ["b03", "לחמניות המבורגר", "bread"], ["d01", "ביצים", "dairy"], ["d02", "קוטג׳ 5%", "dairy"], ["d03", "יוגורט", "dairy"], ["d04", "מוצרלה מגוררת", "dairy"], ["d05", "פרמזן", "dairy"], ["d06", "פטה", "dairy"], ["d07", "חלומי", "dairy"], ["d08", "חמאה", "dairy"], ["d09", "חלב שיבולת שועל", "dairy"], ["m01", "חזה עוף", "meat"], ["m02", "חזה עוף טחון", "meat"], ["m03", "פרגיות", "meat"], ["m04", "בשר בקר טחון", "meat"], ["m05", "אנטריקוט", "meat"], ["m06", "פילה סלמון", "meat"], ["s01", "שמן זית", "spice"], ["s02", "תרסיס שמן", "spice"], ["s03", "מלח גס", "spice"], ["s04", "פלפל שחור", "spice"], ["s05", "פפריקה מתוקה", "spice"], ["s06", "פפריקה מעושנת", "spice"], ["s07", "כמון", "spice"], ["s08", "אורגנו", "spice"], ["s09", "קינמון", "spice"], ["s10", "רוטב סויה", "spice"], ["v01", "עגבניות", "veg"], ["v02", "מלפפונים", "veg"], ["v03", "גמבות", "veg"], ["v04", "בצל", "veg"], ["v05", "בצל סגול", "veg"], ["v06", "שום", "veg"], ["v07", "לימונים", "veg"], ["v08", "זוקיני", "veg"], ["v09", "ברוקולי", "veg"], ["v10", "תרד טרי", "veg"], ["v11", "קייל", "veg"], ["v12", "כרוב לבן", "veg"], ["v13", "כרוב סגול", "veg"], ["v14", "בזיליקום", "veg"], ["v15", "תפוחי אדמה", "veg"], ["v16", "בטטות", "veg"], ["v17", "תפוחים", "veg"], ["y01", "שיבולת שועל", "dry"], ["y02", "קינואה", "dry"], ["y03", "בורגול", "dry"], ["y04", "קמח", "dry"], ["y05", "פנקו", "dry"], ["y06", "טונה במים", "dry"], ["y07", "תירס", "dry"], ["y08", "חמאת בוטנים", "dry"], ["y09", "גרעיני דלעת", "dry"]];
  async function seedDefaults() {
    try { for (const [id, name, dept] of SEED) await state.db.doc("defaults/" + id).set({ name, dept }); }
    catch (e) { onWriteError(e); }
  }
  const sortedDefaults = () => { const coll = new Intl.Collator("he"); return [...state.defaults.values()].sort((a, b) => coll.compare(a.name, b.name)); };

  function renderDefaults() {
    const all = sortedDefaults();
    let html = `<div class="defnote">אלה המוצרים הקבועים של הבית, לפי ספר המתכונים. בכל חודש בוחרים מתוכם מה להכניס לרשימת הקניות. ${all.length} מוצרים.</div>`;
    if (!state.defLoaded) { els.list.innerHTML = html + '<div class="state"><strong>טוען…</strong></div>'; return; }
    if (!all.length) { els.list.innerHTML = html + '<div class="state"><strong>רשימת ברירת המחדל ריקה</strong><span>מוסיפים מוצרים בשורה למעלה.</span></div>'; return; }
    for (const d of DEPTS) {
      const its = all.filter(i => (DEPT_NAME[i.dept] ? i.dept : "other") === d.k);
      if (!its.length) continue;
      html += `<section class="sec" style="--c: var(--${d.k})"><h2><span class="dot"></span>${d.n}<span class="cnt">${its.length}</span></h2><ul>`;
      for (const i of its) html += `<li class="it"><span class="chk" style="cursor:default"><span class="name">${esc(i.name)}</span></span>${state.canWrite ? `<button type="button" class="del" data-defdel="${esc(i.id)}" aria-label="הסרת ${esc(i.name)} מברירת המחדל">×</button>` : ""}</li>`;
      html += "</ul></section>";
    }
    els.list.innerHTML = html;
  }

  function renderPicker() {
    const m = state.sel;
    const have = new Set([...state.items.values()].map(i => i.name));
    const all = sortedDefaults();
    const avail = all.filter(i => !have.has(i.name));
    for (const id of [...state.pickSel]) if (!state.defaults.has(id) || have.has(state.defaults.get(id).name)) state.pickSel.delete(id);
    let html = `<div class="picker"><div class="phead"><strong>מה להכניס לרשימה של ${fmtMonth(m)}?</strong>
      <div class="pbtns"><button type="button" data-pall>בחירת הכול</button><button type="button" data-pnone>ניקוי</button></div></div>`;
    if (!all.length) html += '<div class="state"><strong>רשימת ברירת המחדל ריקה</strong><span>מוסיפים אליה מוצרים בלשונית "רשימת ברירת מחדל".</span></div>';
    for (const d of DEPTS) {
      const its = all.filter(i => (DEPT_NAME[i.dept] ? i.dept : "other") === d.k);
      if (!its.length) continue;
      html += `<section class="sec" style="--c: var(--${d.k})"><h2><span class="dot"></span>${d.n}<span class="cnt">${its.filter(i => state.pickSel.has(i.id)).length || ""}</span></h2><ul>`;
      for (const i of its) {
        if (have.has(i.name)) { html += `<li class="it have"><span class="chk" style="cursor:default"><span class="box" style="opacity:.35"></span><span class="name">${esc(i.name)}</span></span><span class="tag">כבר ברשימה</span></li>`; continue; }
        const on = state.pickSel.has(i.id);
        html += `<li class="it${on ? " done picked" : ""}"><button type="button" class="chk" role="checkbox" aria-checked="${on}" data-pid="${esc(i.id)}"><span class="box">${CHECK}</span><span class="name" style="text-decoration:none;color:var(--ink)">${esc(i.name)}</span></button></li>`;
      }
      html += "</ul></section>";
    }
    const n = state.pickSel.size;
    html += `<div class="pbar"><button type="button" class="go" data-padd ${n && !state.adding ? "" : "disabled"}>${n ? "הוספה של " + n + " מוצרים ל-" + fmtMonth(m) : avail.length ? "בחרו מוצרים" : "כל המוצרים כבר ברשימה"}</button><button type="button" data-pcancel>סגירה</button></div></div>`;
    els.list.innerHTML = html;
  }

  function openPicker() {
    state.picking = true; state.pickSel.clear();
    render();
    els.list.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  async function addFromDefaults() {
    if (state.adding || !state.db) return;
    const m = state.sel;
    const have = new Set([...state.items.values()].map(i => i.name));
    const todo = [...state.pickSel].map(id => state.defaults.get(id)).filter(x => x && !have.has(x.name));
    if (!todo.length) return;
    state.adding = true; render();
    try {
      await registerMonth(m, "defaults");
      const now = Date.now();
      for (let i = 0; i < todo.length; i += 4) {
        await Promise.all(todo.slice(i, i + 4).map(x =>
          state.db.collection("items").add({ month: m, name: x.name, dept: x.dept, done: false, boughtAt: null, created: now, by: DEVICE, notified: false })));
      }
      state.picking = false; state.pickSel.clear();
      queueNotify(m, todo.map(x => x.name));
      toast("נוספו " + todo.length + " מוצרים לרשימה של " + fmtMonth(m));
    } catch (e) { onWriteError(e); }
    finally { state.adding = false; render(); }
  }

  async function addDefaults(text, dept) {
    const names = text.split(/[,،\n]/).map(s => s.trim().replace(/\s+/g, " ")).filter(Boolean);
    if (!names.length || !state.db) return;
    const have = new Set([...state.defaults.values()].map(i => i.name));
    let added = 0, already = 0;
    for (const n of names.slice(0, 40)) {
      if (have.has(n)) { already++; continue; }
      try { await state.db.collection("defaults").add({ name: n.slice(0, 60), dept }); have.add(n); added++; }
      catch (e) { onWriteError(e); return; }
    }
    toast([added ? (added === 1 ? "נוסף מוצר לברירת המחדל" : "נוספו " + added + " מוצרים לברירת המחדל") : "", already ? already + " כבר בברירת המחדל" : ""].filter(Boolean).join(" · "));
  }

  async function removeDefault(id) {
    const it = state.defaults.get(id);
    if (!it || !state.db) return;
    try {
      await state.db.doc("defaults/" + id).delete();
      toast("״" + it.name + "״ הוסר מברירת המחדל", async () => {
        try { await state.db.doc("defaults/" + id).set({ name: it.name, dept: it.dept }); } catch (e) { onWriteError(e); }
      });
    } catch (e) { onWriteError(e); }
  }

  function setView(v) {
    state.view = v;
    state.picking = false; state.pickSel.clear();
    els.tMonth.setAttribute("aria-selected", v === "month");
    els.tDef.setAttribute("aria-selected", v === "defaults");
    const month = v === "month";
    els.navBar.hidden = !month;
    els.prog.hidden = !month;
    els.filt.hidden = !month;
    els.today.hidden = !month || state.sel === curMonth;
    els.name.placeholder = month ? "מה להוסיף? למשל: חלב, ביצים" : "מוצר חדש לברירת המחדל";
    try { localStorage.setItem("view", v); } catch (e) {}
    render();
  }
  els.tMonth.addEventListener("click", () => setView("month"));
  els.tDef.addEventListener("click", () => setView("defaults"));
  els.pickBtn.addEventListener("click", openPicker);

  // ---------- notifications & icon badge ----------
  // additions are collected for a few seconds and sent as one notification to the other phones
  const pendingNotify = { names: [], months: new Set(), timer: null };
  function queueNotify(month, names) {
    if (!window.NOTIFY_URL || !names.length) return;
    pendingNotify.names.push(...names);
    pendingNotify.months.add(month);
    clearTimeout(pendingNotify.timer);
    pendingNotify.timer = setTimeout(flushNotify, 8000);
  }
  function flushNotify() {
    clearTimeout(pendingNotify.timer);
    if (!pendingNotify.names.length || !window.NOTIFY_URL) return;
    const payload = JSON.stringify({ code: window.FAMILY_CODE, by: DEVICE, names: pendingNotify.names.slice(0, 100), months: [...pendingNotify.months] });
    pendingNotify.names = []; pendingNotify.months.clear();
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(window.NOTIFY_URL, new Blob([payload], { type: "text/plain" }))) return;
    } catch (e) {}
    fetch(window.NOTIFY_URL, { method: "POST", body: payload, headers: { "Content-Type": "text/plain" }, keepalive: true }).catch(() => {});
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushNotify(); });

  const notifBtn = document.getElementById("notifBtn");
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  const pushCapable = "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;

  function renderBell() {
    if (!state.db) { notifBtn.hidden = true; return; }
    if (isIOS && !standalone) { notifBtn.hidden = false; notifBtn.className = "bell on"; notifBtn.textContent = "התראות: מהאייקון במסך הבית"; return; }
    if (!pushCapable || !window.firebase || !firebase.messaging || !window.VAPID_KEY) { notifBtn.hidden = true; return; }
    const p = Notification.permission;
    notifBtn.hidden = false;
    notifBtn.className = p === "granted" ? "bell on" : "bell";
    notifBtn.textContent = p === "granted" ? "התראות פעילות" : p === "denied" ? "התראות חסומות" : "הפעלת התראות";
  }

  async function registerPush(prompt) {
    try {
      if (prompt) { const r = await Notification.requestPermission(); if (r !== "granted") { renderBell(); if (r === "denied") toast("ההתראות חסומות. אפשר לאשר אותן בהגדרות האייפון ← התראות ← קניות."); return; } }
      if (Notification.permission !== "granted") return;
      const reg = await navigator.serviceWorker.ready;
      const token = await firebase.messaging().getToken({ vapidKey: window.VAPID_KEY, serviceWorkerRegistration: reg });
      if (!token) return;
      let known = null;
      try { known = localStorage.getItem("pushToken"); } catch (e) {}
      if (known !== token || prompt) {
        await state.db.doc("devices/" + DEVICE).set({ token, unread: 0, updatedAt: Date.now(), ios: isIOS });
        try { localStorage.setItem("pushToken", token); } catch (e) {}
      }
      if (prompt) toast("ההתראות הופעלו. תקבלו עדכון כשמישהו מוסיף מוצרים.");
    } catch (e) {
      if (prompt) toast("לא הצלחתי להפעיל התראות. נסו שוב בעוד רגע.");
    }
    renderBell();
  }
  notifBtn.addEventListener("click", () => {
    if (isIOS && !standalone) { toast("כדי לקבל התראות, פתחו את האפליקציה מהאייקון במסך הבית."); return; }
    if (Notification.permission === "granted") { toast("ההתראות כבר פעילות במכשיר הזה."); return; }
    if (Notification.permission === "denied") { toast("ההתראות חסומות. אפשר לאשר אותן בהגדרות האייפון ← התראות ← קניות."); return; }
    registerPush(true);
  });

  // opening the app clears the dot on the icon
  let lastClear = 0;
  async function clearBadge() {
    try { if (navigator.clearAppBadge) await navigator.clearAppBadge(); } catch (e) {}
    try { const r = await navigator.serviceWorker?.ready; r && r.getNotifications && (await r.getNotifications()).forEach(n => n.close()); } catch (e) {}
    if (!state.db || Date.now() - lastClear < 5000) return;
    lastClear = Date.now();
    try { if (localStorage.getItem("pushToken")) await state.db.doc("devices/" + DEVICE).update({ unread: 0 }); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") clearBadge(); });

  // ---------- events ----------
  els.list.addEventListener("click", e => {
    const t = e.target;
    if (t.closest("[data-pick]")) { openPicker(); return; }
    const pid = t.closest("[data-pid]");
    if (pid) { const id = pid.dataset.pid; state.pickSel.has(id) ? state.pickSel.delete(id) : state.pickSel.add(id); render(); return; }
    if (t.closest("[data-pall]")) { const have = new Set([...state.items.values()].map(i => i.name)); for (const d of state.defaults.values()) if (!have.has(d.name)) state.pickSel.add(d.id); render(); return; }
    if (t.closest("[data-pnone]")) { state.pickSel.clear(); render(); return; }
    if (t.closest("[data-padd]")) { addFromDefaults(); return; }
    if (t.closest("[data-pcancel]")) { state.picking = false; state.pickSel.clear(); render(); return; }
    const dd = t.closest("[data-defdel]");
    if (dd) { if (state.canWrite) removeDefault(dd.dataset.defdel); return; }
    const c = e.target.closest("[data-create]");
    if (c) { createMonth(state.sel, c.dataset.create || null); return; }
    const li = e.target.closest(".it");
    if (!li || !state.canWrite) return;
    if (e.target.closest(".del")) removeItem(li.dataset.id);
    else if (e.target.closest(".chk")) toggle(li.dataset.id);
  });
  els.form.addEventListener("submit", e => {
    e.preventDefault();
    const v = els.name.value;
    if (!v.trim()) { els.name.focus(); return; }
    try { localStorage.setItem("lastDept", els.dept.value); } catch (er) {}
    els.name.value = "";
    if (state.view === "defaults") addDefaults(v, els.dept.value); else addItems(v, els.dept.value);
    els.name.focus();
  });
  function setFilter(f) {
    state.filter = f;
    els.fAll.setAttribute("aria-pressed", f === "all");
    els.fLeft.setAttribute("aria-pressed", f === "left");
    try { localStorage.setItem("filter", f); } catch (e) {}
    render();
  }
  els.fAll.addEventListener("click", () => setFilter("all"));
  els.fLeft.addEventListener("click", () => setFilter("left"));
  try { if (localStorage.getItem("filter") === "left") setFilter("left"); } catch (e) {}

  // ---------- connect ----------
  function showUnavailable(title, body) {
    state.loaded = false;
    els.list.innerHTML = `<div class="state"><strong>${title}</strong><span>${body}</span></div>`;
    [els.name, els.dept, els.addBtn].forEach(e => e.disabled = true);
  }

  let netTimer = null;
  const settle = () => { clearTimeout(netTimer); els.net.hidden = true; };

  function subscribeItems() {
    if (!state.db) return;
    if (state.unsub) { state.unsub(); state.unsub = null; }
    const m = state.sel;
    state.items = new Map();
    state.loaded = false;
    els.list.innerHTML = '<div class="state"><strong>טוען את הרשימה…</strong></div>';
    render();
    clearTimeout(netTimer);
    netTimer = setTimeout(() => {
      els.net.hidden = false;
      els.net.textContent = state.loaded ? "ייתכן שהרשימה לא מעודכנת. בודק חיבור…" : "לא מצליח להגיע לרשימה כרגע. בדקו את החיבור לאינטרנט.";
    }, 10000);
    state.unsub = state.db.collection("items").where("month", "==", m).onSnapshot(snap => {
      if (state.sel !== m) return;
      state.items = new Map(snap.docs.map(d => { const x = d.data() || {}; return [d.id, { id: d.id, month: m, name: String(x.name || ""), dept: String(x.dept || "other"), done: !!x.done, created: x.created, boughtAt: typeof x.boughtAt === "number" ? x.boughtAt : null }]; }));
      state.loaded = true;
      if (!snap.metadata.fromCache) settle();
      render();
    }, err => { settle(); if (!state.loaded && state.sel === m) showUnavailable("הרשימה לא נטענה", "פתחו את הדף מחדש בעוד רגע."); });
  }

  (async () => {
    let db = null;
    try { db = await window.APP_DB_READY; } catch (e) { db = null; }
    if (!db) {
      if (!window.FAMILY_CODE) showUnavailable("חסר הקוד המשפחתי", "פתחו את האפליקציה פעם אחת מהקישור המשפחתי המלא (זה שמסתיים ב-#k=...), ואז הוסיפו אותה למסך הבית.");
      else showUnavailable("האפליקציה עוד לא מחוברת", "חסרות הגדרות החיבור לשרת. נסו שוב מאוחר יותר.");
      return;
    }
    state.db = db;
    db.collection("months").onSnapshot(snap => {
      state.months = new Set(snap.docs.filter(d => (d.data() || {}).created).map(d => d.id).filter(isMonth));
      const first = !state.monthsLoaded && !snap.metadata.fromCache;
      if (first) state.monthsLoaded = true;
      // on first load, open the latest list that is not in the future when this month has none
      if (first && !state.navigated && !state.months.has(state.sel) && state.months.size) {
        const past = [...state.months].filter(x => x <= curMonth).sort();
        const pick = past.length ? past[past.length - 1] : [...state.months].sort()[0];
        selectMonth(pick, false);
      }
      renderNav();
      render();
    }, () => {});
    db.collection("defaults").onSnapshot(snap => {
      state.defaults = new Map(snap.docs.map(d => { const x = d.data() || {}; return [d.id, { id: d.id, name: String(x.name || ""), dept: String(x.dept || "other") }]; }).filter(([, x]) => x.name));
      if (!snap.metadata.fromCache) {
        state.defLoaded = true;
        if (snap.empty && !state.seeded) { state.seeded = true; seedDefaults(); }
      }
      if (state.view === "defaults" || state.picking) render();
    }, () => { state.defLoaded = true; });
    subscribeItems();
    renderBell();
    clearBadge();
    if (pushCapable && Notification.permission === "granted") registerPush(false);
  })();

  renderNav();
  try { if (localStorage.getItem("view") === "defaults") setView("defaults"); } catch (e) {}
  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
