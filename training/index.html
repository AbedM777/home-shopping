<style>
/* Layout: a training app on a deep-navy field. Five views (Today, Train, Eat, Progress, Plan) behind a tab bar:
   fixed to the bottom on phones, under the header on wide screens. Content sits on light cards; colour encodes
   day type (strength blue, walk green, recovery slate) and macros (protein blue, carbs amber, fat rose). */
:root{
  --bg:#0F1E36; --on-bg:#F1F5FB; --on-bg-muted:#A8B7CE; --on-bg-line:rgba(241,245,251,.16); --on-bg-soft:rgba(241,245,251,.07);
  --accent-on-bg:#86A8FF; --raised:#1A3157; --nav-bg:#0A1628;
  --surface:#FFFFFF; --sunk:#EEF2F8; --ink:#13203A; --muted:#56627A; --line:#D7DEEA;
  --accent:#1F4ED8; --accent-soft:#E3EAFD; --on-accent:#FFFFFF;
  --walk:#16865A; --walk-soft:#DDF1E7; --walk-on-bg:#5AD19B; --rest:#66727F; --rest-soft:#E8ECF2; --rest-on-bg:#A8B7CE;
  --mp:#1F4ED8; --mc:#D98E1F; --mf:#C24D6B; --mv:#16865A;
  --warn:#A8620A; --warn-soft:#FBEBD3; --alert:#B3263E; --alert-soft:#F9DFE4; --ok:#16865A; --ok-soft:#DDF1E7;
  --plate:#EEF2F7; --plate-2:#DCE4EE; --paper:#EEF2F7; --paper-ink:#13203A;
  --display:"Barlow Condensed","Heebo","Arial Narrow",sans-serif;
  --body:"Source Sans 3","Heebo","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1527; --raised:#18294A; --nav-bg:#071022;
  --surface:#13213A; --sunk:#1A2B47; --ink:#E6ECF5; --muted:#9FB0C8; --line:#263A5C;
  --accent:#86A6FF; --accent-soft:#1D2C52; --on-accent:#0A1527;
  --walk:#4CC690; --walk-soft:#173527; --rest:#9AA8BC; --rest-soft:#1F2E48;
  --mp:#86A6FF; --mc:#F0B04A; --mf:#EA809B; --mv:#4CC690;
  --warn:#F0B04A; --warn-soft:#3A2C12; --alert:#F08398; --alert-soft:#3D1A22; --ok:#4CC690; --ok-soft:#173527;
  --plate:#DCE3EC; --plate-2:#C9D3E0;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1527; --raised:#18294A; --nav-bg:#071022;
  --surface:#13213A; --sunk:#1A2B47; --ink:#E6ECF5; --muted:#9FB0C8; --line:#263A5C;
  --accent:#86A6FF; --accent-soft:#1D2C52; --on-accent:#0A1527;
  --walk:#4CC690; --walk-soft:#173527; --rest:#9AA8BC; --rest-soft:#1F2E48;
  --mp:#86A6FF; --mc:#F0B04A; --mf:#EA809B; --mv:#4CC690;
  --warn:#F0B04A; --warn-soft:#3A2C12; --alert:#F08398; --alert-soft:#3D1A22; --ok:#4CC690; --ok-soft:#173527;
  --plate:#DCE3EC; --plate-2:#C9D3E0;
  color-scheme:dark;}
:root[lang="he"]{--display:"Heebo","Arial",sans-serif; --body:"Heebo","Arial",sans-serif}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--on-bg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:1040px;margin-inline:auto;padding-inline:16px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance}
:root:not([lang="he"]) h1,:root:not([lang="he"]) h2{letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
:focus-visible{outline:2px solid var(--accent-on-bg);outline-offset:2px}

/* ---------- header + nav ---------- */
.top{background:var(--nav-bg);border-bottom:1px solid var(--on-bg-line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:grid;min-width:0}
.brand-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em}
:root[lang="he"] .brand-name{letter-spacing:0}
.brand-sub{font-size:13px;color:var(--on-bg-muted)}
.top-actions{display:flex;align-items:center;gap:10px;flex:none}
.sync{width:10px;height:10px;border-radius:50%;background:var(--on-bg-muted);flex:none}
.sync[data-s="synced"]{background:var(--walk-on-bg)} .sync[data-s="syncing"],.sync[data-s="connecting"]{background:#F0B04A} .sync[data-s="error"],.sync[data-s="offline"]{background:#F08398}
.lang{background:var(--on-bg-soft);border:1px solid var(--on-bg-line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--on-bg)}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--nav-bg);border-top:1px solid var(--on-bg-line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:4px;max-width:640px}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;color:var(--on-bg-muted);font-size:11.5px;font-weight:600;min-width:0;border-top:2px solid transparent}
.nav svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--on-bg);border-top-color:var(--accent-on-bg)}
.nav button[aria-current="page"] svg{stroke:var(--accent-on-bg)}
@media (min-width:860px){
  body{padding-bottom:40px}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--on-bg-line);padding-bottom:0}
  .nav-in{max-width:1040px;display:flex;gap:4px;padding-inline:16px}
  .nav button{grid-auto-flow:column;align-items:center;gap:8px;padding:12px 16px;font-size:15px;border-top:0;border-bottom:2px solid transparent}
  .nav button[aria-current="page"]{border-bottom-color:var(--accent-on-bg)}
  .nav svg{width:20px;height:20px}
}

/* ---------- shared pieces ---------- */
#view{padding-block:20px 8px;display:grid;gap:20px}
.sec{display:grid;gap:12px;min-width:0}
.sec-head{display:grid;gap:4px}
.sec-head h2{font-size:26px}
.sec-head p{color:var(--on-bg-muted);font-size:15px;max-width:66ch}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-on-bg)}
:root[lang="he"] .eyebrow{letter-spacing:.02em}
.card{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.card h3{font-size:20px}
.card .muted,.muted{color:var(--muted)}
.card .eyebrow{color:var(--accent)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:10px 16px;font-weight:700;font-size:15px;text-decoration:none;line-height:1.2}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-onbg{background:var(--on-bg-soft);border-color:var(--on-bg-line);color:var(--on-bg)}
.btn-ok{background:var(--ok-soft);color:var(--ok)}
.btn-danger{background:var(--alert-soft);color:var(--alert)}
.btn-sm{padding:6px 12px;font-size:14px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{background:none;border:0;padding:0;color:var(--on-bg-muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
:root[lang="he"] .pill{letter-spacing:0;font-size:13px}
.pill-lift{background:var(--accent-soft);color:var(--accent)} .pill-walk{background:var(--walk-soft);color:var(--walk)} .pill-rest{background:var(--rest-soft);color:var(--rest)}
.pill-ok{background:var(--ok-soft);color:var(--ok)} .pill-warn{background:var(--warn-soft);color:var(--warn)} .pill-alert{background:var(--alert-soft);color:var(--alert)}
.pill-onbg{background:var(--on-bg-soft);color:var(--on-bg);border:1px solid var(--on-bg-line)}
.seg{display:inline-flex;background:var(--on-bg-soft);border:1px solid var(--on-bg-line);border-radius:12px;padding:3px;gap:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:14.5px;color:var(--on-bg-muted);display:grid;justify-items:start;line-height:1.15;text-align:start}
.seg button small{font-weight:600;font-size:12px;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--accent-on-bg);color:#0A1527}
.field{display:grid;gap:4px;min-width:0}
.field label,.label{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
:root[lang="he"] .field label,:root[lang="he"] .label{letter-spacing:0;font-size:13.5px}
.inp{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.inline-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inline-form .field{flex:1 1 110px}
.note-onbg{border:1px solid var(--on-bg-line);border-radius:var(--r);padding:12px 14px;color:var(--on-bg-muted);font-size:14.5px}
.table-wrap{overflow-x:auto;background:var(--surface);color:var(--ink);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
:root[lang="he"] th{letter-spacing:0;font-size:13.5px}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.is-now td{background:var(--accent-soft)}
tr.is-now td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
:root[dir="rtl"] tr.is-now td:first-child{box-shadow:inset -3px 0 0 var(--accent)}

/* ---------- today ---------- */
.hero{display:grid;gap:10px;padding:4px 0 2px}
.hero-week{font-size:clamp(46px,13vw,76px);line-height:.95;text-transform:uppercase;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-week small{font-size:.36em;color:var(--on-bg-muted);font-weight:600;letter-spacing:.04em}
:root[lang="he"] .hero-week{font-size:clamp(40px,11vw,64px);line-height:1.05}
.weekbar{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:520px}
.weekbar i{height:8px;border-radius:3px;background:var(--on-bg-line)}
.weekbar i.past{background:var(--accent-on-bg);opacity:.55} .weekbar i.now{background:var(--accent-on-bg)}
.weekbar i.dl{background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(10,22,40,.5) 3px 5px)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px}
.hero-focus{font-size:17px;max-width:60ch}
.session{border-inline-start:5px solid var(--accent);gap:8px}
.session.k-walk{border-inline-start-color:var(--walk)} .session.k-rest{border-inline-start-color:var(--rest)}
.session h3{font-size:30px;text-transform:uppercase}
:root[lang="he"] .session h3{font-size:26px}
.session-top{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
.session-list{color:var(--muted);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);color:var(--ink);padding:12px 12px 11px;display:grid;gap:1px;min-width:0}
.stat b{font-family:var(--display);font-size:28px;line-height:1.05;font-weight:700}
.stat b small{font-size:15px;color:var(--muted);font-weight:600}
.stat > span{font-size:12.5px;color:var(--muted);font-weight:600}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px;color:var(--muted)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.habits{list-style:none;margin:0;padding:0;display:grid}
.habits label{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15.5px}
.habits li:last-child label{border-bottom:0}
.habits input{width:22px;height:22px;accent-color:var(--walk);flex:none;margin:0}
.habits input:checked+span{color:var(--muted);text-decoration:line-through}
.verdict{border-inline-start:5px solid var(--rest)}
.verdict[data-v="ok"]{border-inline-start-color:var(--ok)} .verdict[data-v="slow"],.verdict[data-v="watch"]{border-inline-start-color:var(--warn)} .verdict[data-v="fast"]{border-inline-start-color:var(--alert)}

/* ---------- train ---------- */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip button{background:var(--on-bg-soft);border:1px solid var(--on-bg-line);border-radius:10px;padding:7px 2px 6px;display:grid;justify-items:center;gap:3px;color:var(--on-bg);min-width:0}
.strip b{font-family:var(--display);font-size:16px;line-height:1}
.strip i{width:9px;height:9px;border-radius:50%;background:var(--accent-on-bg);display:block}
.strip .k-walk i{background:var(--walk-on-bg)} .strip .k-rest i{background:var(--rest-on-bg)}
.strip .is-done i{box-shadow:0 0 0 3px rgba(90,209,155,.35)}
.strip small{font-size:10.5px;color:var(--on-bg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.strip .is-today b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--accent-on-bg)}
.strip button[aria-pressed="true"]{border-color:var(--on-bg);background:rgba(241,245,251,.16)}
.strip button[aria-pressed="true"] small{color:var(--on-bg)}
.rx{display:grid;gap:6px;background:var(--raised);border:1px solid var(--on-bg-line);border-radius:var(--r);padding:14px 16px}
.rx h3{font-size:20px}
.rx p{color:var(--on-bg-muted);font-size:15px}
.sess-head{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--on-bg-line)}
.sess-head h2{font-size:clamp(30px,8vw,40px);text-transform:uppercase}
.sess-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14.5px;margin:0}
.sess-meta dt{color:var(--on-bg-muted);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
:root[lang="he"] .sess-meta dt{letter-spacing:0;font-size:13.5px}
.sess-meta dd{margin:0}
.blk{display:grid;gap:10px}
.blk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.blk-label{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent-on-bg);line-height:1}
.blk-kind{font-size:14px;color:var(--on-bg-muted)}
.xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:820px){.xgrid{grid-template-columns:minmax(0,1fr)}}
.x{background:var(--surface);color:var(--ink);border-radius:var(--r);overflow:hidden;display:grid;min-width:0}
.x-media{position:relative;background:var(--paper);direction:ltr}
.x-media img{width:100%;aspect-ratio:800/280;object-fit:contain;display:block}
.x-pos{position:absolute;bottom:8px;width:22px;height:22px;border-radius:50%;background:var(--paper-ink);color:#fff;font:700 12px/22px var(--body);text-align:center}
.x-pos.p1{left:8px} .x-pos.p2{left:calc(50% + 8px)}
.x-body{padding:12px 14px 14px;display:grid;gap:8px;min-width:0}
.x-head{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.x-head h4{font-size:20px;min-width:0}
.x-tag{font-family:var(--display);font-weight:700;color:var(--accent);margin-inline-end:6px}
.dose{flex:none;font-family:var(--display);font-weight:700;font-size:19px;color:var(--accent)}
.x-target{font-size:14px;color:var(--muted)}
.x-target b{color:var(--ink)}
.cues{margin:0;padding-inline-start:18px;display:grid;gap:2px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;background:var(--sunk);border-radius:8px;padding:3px 9px 3px 3px;padding-inline:3px 9px}
.chip svg{width:40px;height:27px;display:block;background:var(--plate);border-radius:6px;padding:2px}
details.swap{font-size:14px;color:var(--muted)}
details.swap summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.swap p{padding-top:4px}
.log{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:7px}
.log-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.log-last{font-size:13.5px;color:var(--muted)}
.set{display:flex;align-items:center;gap:6px}
.set-n{width:20px;flex:none;font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.set .inp{width:66px;flex:0 1 66px;text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums}
.set .u{font-size:12.5px;color:var(--muted);flex:none}
.set .ok{margin-inline-start:auto;flex:none;width:40px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1}
.set.is-done .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.set.is-done .inp{border-color:var(--ok)}
.hint{font-size:13.5px;color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:7px 10px}
.finish{display:grid;gap:8px;justify-items:start;padding-top:4px}
.timer{position:fixed;inset-inline:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:40;max-width:420px;margin-inline:auto;background:var(--accent-on-bg);color:#0A1527;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.timer.is-go{background:var(--walk-on-bg)}
.timer b{font-family:var(--display);font-size:34px;line-height:1;min-width:76px;font-variant-numeric:tabular-nums;direction:ltr}
.timer span{font-weight:700;flex:1;min-width:0}
.timer button{background:rgba(10,21,39,.14);border:0;border-radius:9px;padding:8px 11px;font-weight:700;color:#0A1527;flex:none}

.toast{position:fixed;inset-inline:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:41;max-width:440px;margin-inline:auto;background:var(--on-bg);color:#0A1527;border-radius:12px;padding:11px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}

.chart-box{gap:8px}
.chart{width:100%;height:auto;display:block;direction:ltr}

.entries{list-style:none;margin:0;padding:0;display:grid}

    if (!Auth.user) { render(); const f = $("#au-email"); if (f && !f.value) f.value = em; const g = $("#au-pw"); if (g) g.value = kind === "reset" ? "" : pw; }
  }
  function vLogin() {
    if (!Auth.known) return '<section class="card login"><p class="muted">' + t("sync_wait") + "</p></section>";
    return '<section class="card login"><h2>' + t("login_h") + '</h2><p class="muted">' + t("login_p") + "</p>" +
      '<form data-form="login" autocomplete="on"><div class="field"><label for="au-email">' + t("email") + '</label><input class="inp" id="au-email" type="email" autocomplete="username" inputmode="email" dir="ltr" required></div>' +
      '<div class="field"><label for="au-pw">' + t("password") + '</label><input class="inp" id="au-pw" type="password" autocomplete="current-password" dir="ltr" minlength="6"></div>' +
      (Auth.msg ? '<p class="msg ' + (Auth.msgKind || "warn") + '" role="status">' + Auth.msg + "</p>" : "") +
      '<div class="btn-row"><button class="btn btn-primary" type="submit"' + (Auth.busy ? " disabled" : "") + ">" + t("sign_in") + '</button><button class="btn btn-ghost" type="button" data-action="auth-up"' + (Auth.busy ? " disabled" : "") + ">" + t("sign_up") + "</button></div>" +
      '<p class="small"><button class="link" type="button" data-action="auth-reset">' + t("forgot") + "</button></p></form>" +
      '<p class="small muted">' + t("login_note") + "</p></section>";
  }

  /* ---------- program logic ---------- */
  const progWeek = (date) => Math.floor(diffDays(sundayOf(date || today()), sundayOf(S.settings.start)) / 7) + 1;
  const phaseOf = (w) => { const k = clamp(w, 1, PROGRAM.weeks); return PHASES.find((p) => k >= p.from && k <= p.to); };
  function status() { const w = progWeek(); return { week: w, wk: clamp(w, 1, PROGRAM.weeks), state: w < 1 ? "before" : w > PROGRAM.weeks ? "after" : "on", phase: phaseOf(w) }; }
  const dayPlan = (date) => WEEK[parse(date).getDay()];
  const dayType = (date) => (dayPlan(date).kind === "lift" ? "train" : "rest");
  function targets(type) { const b = TARGETS[type], adj = S.settings.kcalAdj || 0; return { kcal: b.kcal + adj, p: b.p, c: Math.round(b.c + adj / 4), f: b.f }; }
  const dayRec = (date, create) => { let r = S.days.d[date]; if (!r && create) { r = S.days.d[date] = { c: {} }; } if (r && !r.c) r.c = {}; return r; };
  const wkey = (date, sid) => date + "|" + sid;
  const getW = (date, sid) => S.workouts.s[wkey(date, sid)];
  function ensureW(date, sid, block) { const k = wkey(date, sid); if (!S.workouts.s[k]) S.workouts.s[k] = { date: date, sid: sid, block: block, done: false, ex: {} }; if (!S.workouts.s[k].ex) S.workouts.s[k].ex = {}; return S.workouts.s[k]; }
  const itemsOf = (sess) => sess.blocks.reduce((a, b) => a.concat(b.items.map((it) => ({ ex: it[0], sets: it[1], reps: it[2], lo: it[3], hi: it[4], side: it[5] === "s", note: it[6], blk: b }))), []);
  const setCount = (sets, week) => (phaseOf(week).half ? Math.max(1, Math.ceil(sets / 2)) : sets);
  const setFilled = (s) => !!s && s.r != null;
  function dayDone(date) {
    const p = dayPlan(date), r = S.days.d[date];
    if (r && r.c && r.c.session) return true;
    if (p.kind === "lift") { const w = getW(date, p.sid); return !!(w && w.done); }
    return false;
  }
  function lastLog(ex, before) {
    let best = null;
    for (const k in S.workouts.s) {
      const w = S.workouts.s[k]; const sets = w.ex && w.ex[ex];
      if (!sets || w.date >= before || !sets.some(setFilled)) continue;
      if (!best || w.date > best.date) best = { date: w.date, sets: sets.filter(setFilled) };
    }
    return best;
  }
  function hintFor(item, last) {
    if (!last) return null;
    const tr = EX[item.ex].track, sets = last.sets;
    if (tr === "t") return t("h.time", { n: Math.max.apply(null, sets.map((s) => s.r)) });
    if (tr === "r" || !item.hi) return t("h.reps", { n: sets.reduce((a, s) => a + s.r, 0) });
    const maxW = Math.max.apply(null, sets.map((s) => s.w || 0));
    if (sets.every((s) => s.r >= item.hi)) return t(maxW >= (S.settings.maxDb || PROGRAM.maxDb) ? "h.ceiling" : "h.up");
    if (sets.some((s) => s.r < item.lo)) return t("h.low");
    return t("h.hold");
  }
  const fmtSet = (s, tr) => (tr === "wr" && s.w != null ? s.w + "×" + s.r : tr === "t" ? s.r + " " + t("sec") : String(s.r));

  /* weight trend + check-in verdict */
  function avg7(end) { let sum = 0, n = 0; for (let i = 0; i < 7; i++) { const v = S.weights.w[addDays(end, -i)]; if (v != null) { sum += v; n++; } } return n >= 3 ? sum / n : null; }
  function trend() {
    const d = today(), a0 = avg7(d), a1 = avg7(addDays(d, -7)), a2 = avg7(addDays(d, -14));
    const r1 = a0 != null && a1 != null ? a1 - a0 : null, r2 = a1 != null && a2 != null ? a2 - a1 : null;
    let v = "nodata";
    if (r1 != null) v = r2 != null && r1 < 0.3 && r2 < 0.3 ? "slow" : r2 != null && r1 > 1 && r2 > 1 ? "fast" : r1 >= 0.3 && r1 <= 1 ? "ok" : "watch";
    const dates = Object.keys(S.weights.w).sort();
    const latest = dates.length ? S.weights.w[dates[dates.length - 1]] : null;
    return { a0: a0, a1: a1, r1: r1, r2: r2, verdict: v, cur: a0 != null ? a0 : latest, n: dates.length };
  }
  function mealsFor(date, type) {
    const r = S.days.d[date];
    if (r && r.meals && r.meals.type === type) return r.meals;
    return Object.assign({ type: type, x: [] }, PRESETS[type]);
  }
  function mealTotals(m) {
    const tot = { kcal: 0, p: 0, c: 0, f: 0 };
    const add = (o) => { if (o) for (const k in tot) tot[k] += o[k]; };
    SLOTS.forEach((s) => add(RECIPES.find((r) => r.id === m[s.id])));
    (m.x || []).forEach((id) => add(ADDONS.find((a) => a.id === id)));
    return tot;
  }
  function streak() {
    let n = 0, d = today();
    const score = (date) => { const r = S.days.d[date]; return r && r.c ? HABITS.filter((h) => r.c[h.id]).length : 0; };
    if (score(d) < 4) d = addDays(d, -1);
    while (score(d) >= 4) { n++; d = addDays(d, -1); }
    return n;
  }

  /* ---------- view pieces ---------- */
  const ill = (k) => '<svg viewBox="0 0 240 160" aria-hidden="true" focusable="false"><use href="#eq-' + k + '"/></svg>';
  const kindName = (k) => t(k === "lift" ? "strength" : k === "walk" ? "walk" : "recovery");
  function planLine(date) {

  }

  }

  /* ---------- TODAY ---------- */

        '<div class="hero-meta"><span class="pill pill-onbg">' + L(ph.name) + '</span><span class="pill pill-onbg">' + t("rir", { r: N(ph.rir) }) + "</span></div>" +
        '<p class="hero-focus">' + L(WEEK_FOCUS[st.week - 1]) + "</p>";
    }
    let sess;
    if (p.kind === "lift") {
      const block = ph.block, se = SESSIONS[block][p.sid], w = getW(d, p.sid), started = w && Object.keys(w.ex || {}).length;
      sess = '<section class="card session k-lift"><div class="session-top"><div><p class="eyebrow">' + t("today") + " · " + t("strength") + "</p><h3>" + L(se.title) + "</h3></div>" +
        (done ? '<span class="pill pill-ok">' + t("done") + "</span>" : "") + "</div>" +
        "<p><b>" + L(se.focus) + "</b> · " + planLine(d) + "</p>" + (ph.half ? '<p><span class="pill pill-warn">' + t("half_sets") + "</span></p>" : "") +
        '<p class="session-list">' + itemsOf(se).map((it) => L(EX[it.ex].n)).join(" · ") + "</p>" +
        '<div class="btn-row"><button class="btn btn-primary" data-action="open-session" data-sid="' + p.sid + '">' + t(started && !done ? "continue_session" : "open_session") + "</button></div></section>";
    } else {
      sess = '<section class="card session k-' + p.kind + '"><div class="session-top"><div><p class="eyebrow">' + t("today") + " · " + kindName(p.kind) + "</p><h3>" + L(p.title) + "</h3></div>" +
        (done ? '<span class="pill pill-ok">' + t("done") + "</span>" : "") + "</div><p><b>" + L(p.sub) + "</b> · " + planLine(d) + "</p>" +
        '<div class="btn-row"><button class="btn ' + (done ? "btn-ghost" : "btn-primary") + '" data-action="toggle-session">' + t(done ? "undo" : "mark_done") + '</button><button class="btn btn-ghost" data-action="open-walks">' + t("walk_h") + "</button></div></section>";
    }
    const stats = '<div class="stats">' +
      '<div class="stat"><span>' + t("kcal") + "</span><b>" + N(fmt(tg.kcal)) + "</b><span>" + t(type === "train" ? "train_day" : "rest_day") + "</span></div>" +
      '<div class="stat"><span>' + t("protein") + "</span><b>" + N(tg.p) + " <small>" + t("g") + "</small></b><span>" + N("2.2") + " " + t("g") + " / " + t("kg") + "</span></div>" +
      '<div class="stat"><span>' + t("steps") + "</span><b>" + N(fmt(ph.steps)) + "</b><span>" + L(ph.name) + "</span></div>" +
      '<div class="stat"><span>' + t("water") + "</span><b>" + N(3) + " <small>" + t("litre") + "</small></b><span>&nbsp;</span></div></div>";
    const wv = S.weights.w[d];
    const weight = '<section class="card"><h3>' + t("weight") + '</h3><form class="inline-form" data-form="weight-today"><div class="field"><label for="w-today">' + t("weight_today") + ", " + t("kg") + '</label><input class="inp" id="w-today" inputmode="decimal" autocomplete="off" placeholder="' + f1(tr.cur != null ? tr.cur : S.settings.startWeight) + '" value="' + (wv != null ? wv : "") + '"></div><button class="btn btn-primary" type="submit">' + t("save") + "</button></form>" +
      '<div class="kv"><span>' + t("avg7") + ": <b>" + (tr.a0 != null ? N(f1(tr.a0)) + " " + t("kg") : "–") + "</b></span>" +
      (tr.r1 != null ? "<span>" + t("vs_last_week") + ": <b class=\"" + (tr.r1 > 0 ? "up" : "down") + '">' + N((tr.r1 > 0 ? "−" : "+") + f1(Math.abs(tr.r1))) + " " + t("kg") + "</b></span>" : "") + "</div>" +
      '<div class="btn-row"><button class="btn btn-ghost btn-sm" data-view="progress">' + t("see_progress") + "</button></div></section>";
    const nDone = HABITS.filter((h) => rec.c && rec.c[h.id]).length, sk = streak();
    const habits = '<section class="card"><div class="session-top"><h3>' + t("checklist") + '</h3><span class="pill" id="habit-score">' + t("of_done", { n: nDone, t: HABITS.length }) + "</span></div>" +
      '<ul class="habits">' + HABITS.map((h) => '<li><label for="h-' + h.id + '"><input type="checkbox" id="h-' + h.id + '" data-habit="' + h.id + '"' + ((h.id === "session" ? done : rec.c && rec.c[h.id]) ? " checked" : "") + "><span>" + L(h.n) + "</span></label></li>").join("") + "</ul>" +
      (sk >= 2 ? '<p class="small muted">' + t("streak", { n: sk }) + "</p>" : "") + "</section>";
    const m = mealsFor(d, type), mt = mealTotals(m);
    const meals = '<section class="card"><h3>' + t("meals_today") + '</h3><div class="kv"><span>' + t("kcal") + ": <b>" + N(fmt(mt.kcal)) + "</b> / " + N(fmt(tg.kcal)) + "</span><span>" + t("protein") + ": <b>" + N(mt.p) + "</b> / " + N(tg.p) + " " + t("g") + "</span></div>" +
      '<p class="small muted">' + SLOTS.map((s) => { const r = RECIPES.find((x) => x.id === m[s.id]); return r ? L(r.n) : ""; }).filter(Boolean).join(" · ") + "</p>" +
      '<div class="btn-row"><button class="btn btn-ghost btn-sm" data-view="eat">' + t("plan_meals") + "</button></div></section>";
    return '<section class="hero"><p class="eyebrow">' + dLong(d) + "</p>" + hero + '<button class="link" data-action="goto-settings">' + t("edit_start") + "</button></section>" +
      sess + '<section class="sec"><p class="eyebrow">' + t("targets") + "</p>" + stats + "</section>" +
      '<div class="grid2"><div class="sec">' + weight + (tr.verdict !== "nodata" ? verdictCard(tr, false) : "") + '</div><div class="sec">' + habits + meals + "</div></div>";
  }

  /* ---------- TRAIN ---------- */
  const SHORT = { "upper-a": { en: "Upper A", he: "עליון A" }, "lower-a": { en: "Lower A", he: "תחתון A" }, "upper-b": { en: "Upper B", he: "עליון B" }, circuit: { en: "Circuit", he: "מעגל" }, walk: { en: "Walk", he: "הליכה" }, rest: { en: "Easy", he: "קל" } };
  function exCard(it, idx, pos, sid, week, w, logDate) {
    const ex = EX[it.ex], tr = ex.track, n = setCount(it.sets, week), last = lastLog(it.ex, logDate), hint = hintFor(it, last);
    const repsLabel = it.reps === "max" ? t("max") : it.reps;
    const dose = n + " × " + repsLabel + (tr === "t" ? " " + t("sec") : "");
    const saved = (w && w.ex && w.ex[it.ex]) || [];
    let rows = "";
    for (let i = 0; i < n; i++) {
      const s = saved[i] || {}, ls = last ? last.sets[Math.min(i, last.sets.length - 1)] : null;
      const id = "in-" + sid + "-" + it.ex + "-" + i;
      rows += '<div class="set' + (setFilled(s) ? " is-done" : "") + '" data-i="' + i + '"><span class="set-n">' + (i + 1) + "</span>" +
        (tr === "wr" ? '<input class="inp" id="' + id + '-w" data-f="w" inputmode="decimal" autocomplete="off" aria-label="' + esc(t("set") + " " + (i + 1) + ", " + t("kg")) + '" placeholder="' + (ls && ls.w != null ? ls.w : "") + '" value="' + (s.w != null ? s.w : "") + '"><span class="u">' + t("kg") + " ×</span>" : "") +
        '<input class="inp" id="' + id + '-r" data-f="r" inputmode="numeric" autocomplete="off" aria-label="' + esc(t("set") + " " + (i + 1) + ", " + (tr === "t" ? t("sec") : t("reps"))) + '" placeholder="' + (ls ? ls.r : (it.hi || "")) + '" value="' + (s.r != null ? s.r : "") + '"><span class="u">' + (tr === "t" ? t("sec") : t("reps")) + "</span>" +
        '<button class="ok" data-action="set-ok" aria-label="' + esc(t("set_ok", { n: i + 1 })) + '">✓</button></div>';
    }
    const lastLine = last ? t("last", { d: dShort(last.date) }) + ": " + N(last.sets.map((s) => fmtSet(s, tr)).join(" · ")) : t("first_time");
    return '<article class="x"><div class="x-media"><img src="' + IMG[it.ex] + '" alt="' + esc(t("sketch_alt", { n: L(ex.n) })) + '"><span class="x-pos p1">1</span><span class="x-pos p2">2</span></div>' +
      '<div class="x-body"><div class="x-head"><h4>' + (pos ? '<span class="x-tag">' + pos + "</span>" : "") + L(ex.n) + '</h4><span class="dose num">' + dose + "</span></div>" +
      '<p class="x-target">' + L(ex.target) + (it.side ? " · <b>" + t("per_side") + "</b>" : "") + (it.note ? " · <b>" + L(it.note) + "</b>" : "") + "</p>" +
      '<ul class="cues">' + L(ex.cues).map((c) => "<li>" + c + "</li>").join("") + "</ul>" +
      '<div class="chips">' + ex.eq.map((k) => '<span class="chip">' + ill(k) + L(EQ[k]) + "</span>").join("") + "</div>" +
      '<details class="swap"><summary>' + t("swap_q") + "</summary><p>" + L(ex.swap) + "</p></details>" +
      '<div class="log" data-ex="' + it.ex + '" data-sid="' + sid + '" data-rest="' + (it.rest != null ? it.rest : (it.blk.rest || 0)) + '"><div class="log-top"><span class="label">' + t("log") + '</span><span class="log-last">' + lastLine + "</span></div>" + rows +
      (hint ? '<p class="hint">' + hint + "</p>" : "") + "</div></div></article>";
  }
  function vTrain() {
    const d = today(), st = status(), week = st.wk, ph = st.phase;
    if (ui.dow == null) ui.dow = parse(d).getDay();
    { const sel = WEEK[ui.dow]; ui.walks = sel.kind !== "lift"; if (!ui.walks) ui.sid = sel.sid; }
    if (!ui.block) ui.block = ph.block;
    let strip = "";
    const sun = sundayOf(d);
    for (let i = 0; i < 7; i++) {
      const date = addDays(sun, i), p = WEEK[i];
      const label = p.kind === "lift" ? L(SESSIONS[ui.block][p.sid].title) : L(p.title);
      const short = L(SHORT[p.kind === "lift" ? p.sid : p.kind]);
      strip += '<button class="k-' + p.kind + (date === d ? " is-today" : "") + (dayDone(date) ? " is-done" : "") + '" data-action="pick-day" data-dow="' + i + '" aria-pressed="' + (i === ui.dow) + '" aria-label="' + esc(DOW_LONG[lang][i] + ": " + label) + '"><b>' + DOW[lang][i] + "</b><i></i><small>" + short + "</small></button>";
    }
    const tabs = "";
    const rx = '<section class="rx"><p class="eyebrow">' + (st.state === "on" ? t("week_n", { w: N(st.week) }) + " · " : "") + L(ph.name) + "</p><h3>" + t("rir", { r: N(ph.rir) }) + "</h3><p>" + L(WEEK_FOCUS[week - 1]) + "</p>" + (ph.half ? '<p><span class="pill pill-warn">' + t("half_sets") + "</span></p>" : "") + "</section>";
    if (ui.walks) return '<section class="sec"><div class="strip">' + strip + "</div>" + tabs + "</section>" + walksHTML(ph);
    const se = SESSIONS[ui.block][ui.sid], w = getW(d, ui.sid);
    const blockSeg = '<div class="seg" role="group"><button aria-pressed="' + (ui.block === "A") + '" data-action="pick-block" data-v="A">' + t("block_a") + '</button><button aria-pressed="' + (ui.block === "B") + '" data-action="pick-block" data-v="B">' + t("block_b") + "</button></div>";
    let blocks = "", total = 0, logged = 0;
    se.blocks.forEach((b) => {
      const its = itemsOf({ blocks: [b] });
      const pair = !b.circuit && !b.fin && its.length === 2;
      const head = b.circuit ? '<span class="blk-kind">' + t("circuit_l", { n: setCount(b.rounds, week), r: b.rest }) + "</span>" :
        b.fin ? '<span class="blk-label">' + t("finisher") + "</span>" :

    return '<section class="sec"><div class="strip">' + strip + "</div>" + tabs + "</section>" + rx +
      '<section class="sec"><div class="sess-head"><div class="btn-row" style="justify-content:space-between"><p class="eyebrow">' + DOW_LONG[lang][se.dow] + " · " + L(se.focus) + "</p>" + blockSeg + "</div><h2>" + L(se.title) + "</h2>" +
      '<dl class="sess-meta"><dt>' + t("time") + "</dt><dd>" + t(ui.sid === "circuit" ? "circuit_time" : "lift_time") + "</dd><dt>" + t("warmup") + "</dt><dd>" + L(se.warm) + "</dd></dl>" +

  /* ---------- EAT ---------- */
  function vEat() {
    const d = today(); if (!ui.dayType) ui.dayType = dayType(d);

    const seg = '<div class="seg" role="group"><button aria-pressed="' + (type === "train") + '" data-action="daytype" data-v="train">' + t("train_day") + "<small>" + N(fmt(targets("train").kcal)) + " " + t("kcal_u") + '</small></button><button aria-pressed="' + (type === "rest") + '" data-action="daytype" data-v="rest">' + t("rest_day") + "<small>" + N(fmt(targets("rest").kcal)) + " " + t("kcal_u") + "</small></button></div>";
    const pct = (a, b) => clamp(Math.round((a / b) * 100), 0, 100);
    const dk = tot.kcal - tg.kcal, dp = tg.p - tot.p;

    if (dk > 120) msg = '<p class="msg warn">' + t("kcal_over", { n: N(fmt(dk)) }) + "</p>";
    else if (dp > tg.p * 0.06) msg = '<p class="msg warn">' + t("protein_gap", { n: N(Math.round(dp)) }) + "</p>";
    else if (dk < -200) msg = '<p class="msg warn">' + t("kcal_under", { n: N(fmt(-dk)) }) + "</p>";
    const cal = tot.p * 4 + tot.c * 4 + tot.f * 9 || 1;
    const totals = '<section class="card totals" id="totals"><div class="bar-row"><div class="bar-top"><span>' + t("kcal") + "</span><span><b>" + N(fmt(tot.kcal)) + "</b> / " + N(fmt(tg.kcal)) + " " + t("kcal_u") + '</span></div><div class="bar' + (dk > 120 ? " over" : "") + '"><i style="width:' + pct(tot.kcal, tg.kcal) + '%"></i></div></div>' +
      '<div class="bar-row"><div class="bar-top"><span>' + t("protein") + "</span><span><b>" + N(tot.p) + "</b> / " + N(tg.p) + " " + t("g") + '</span></div><div class="bar p"><i style="width:' + pct(tot.p, tg.p) + '%"></i></div></div>' +
      '<div class="macros"><span><i class="k-p"></i>' + t("protein") + " " + N(Math.round((tot.p * 4 / cal) * 100) + " %") + '</span><span><i class="k-c"></i>' + t("carbs") + " " + N(tot.c + " " ) + t("g") + '</span><span><i class="k-f"></i>' + t("fat") + " " + N(tot.f + " ") + t("g") + "</span></div>" + msg + "</section>";

    const slots = SLOTS.map((s) => {

        '<button class="opt" aria-pressed="' + (x.id === m[s.id]) + '" data-action="pick-meal" data-slot="' + s.id + '" data-id="' + x.id + '"><b>' + L(x.n) + '</b><span class="meal-meta"><span>' + N(x.kcal) + " " + t("kcal_u") + "</span><span>" + t("protein") + " " + N(x.p) + " " + t("g") + '</span><span class="pill ' + (x.day === "train" ? "pill-lift" : x.day === "rest" ? "pill-walk" : "") + '">' + fit(x) + "</span></span></button>").join("") + "</div>" : "";
      return '<section class="card slot"><div class="slot-top"><span class="label">' + L(s.n) + '</span><button class="btn btn-ghost btn-sm" data-action="open-slot" data-slot="' + s.id + '" aria-expanded="' + open + '">' + t(open ? "close" : "change") + "</button></div>" +
        '<div class="meal"><b>' + (r ? L(r.n) : "–") + "</b>" + (r ? meta(r) : "") + "</div>" + opts + "</section>";

    const addons = '<section class="card"><h3>' + t("addons_h") + '</h3><p class="small muted">' + t("addons_p") + '</p><div class="toggles">' + ADDONS.map((a) => '<button class="toggle" aria-pressed="' + ((m.x || []).indexOf(a.id) >= 0) + '" data-action="addon" data-id="' + a.id + '">' + L(a.n) + "<small>≈ " + N(a.kcal) + " " + t("kcal_u") + " · " + N(a.p) + " " + t("g") + " " + t("protein") + "</small></button>").join("") + "</div></section>";
    const adj = S.settings.kcalAdj || 0;
    const adjCard = '<section class="card"><h3>' + t("adj_h") + '</h3><p class="small muted">' + t("adj_p") + '</p><div class="btn-row"><button class="btn btn-ghost btn-sm" data-action="adj" data-v="-150">' + N("−150") + '</button><span class="pill">' + t("adj_now") + ": " + N((adj > 0 ? "+" : adj < 0 ? "−" : "") + Math.abs(adj)) + " " + t("kcal_u") + '</span><button class="btn btn-ghost btn-sm" data-action="adj" data-v="150">' + N("+150") + "</button></div></section>";
    return '<section class="sec"><div class="sec-head"><h2>' + t("nav.eat") + "</h2><p>" + t("eat_p") + "</p></div>" + seg + "</section>" + totals +

  /* ---------- PROGRESS ---------- */
  function weightChart() {
    const narrow = window.innerWidth < 600;
    const W = narrow ? 350 : 640, H = narrow ? 250 : 270, Lm = narrow ? 30 : 40, Rm = narrow ? 8 : 14, Tm = 14, Bm = 30;
    const start = sundayOf(S.settings.start), sw = S.settings.startWeight, goal = S.settings.goal, d = today();
    const dates = Object.keys(S.weights.w).sort();
    const first = dates.length && dates[0] < start ? dates[0] : start;
    const span = Math.max(84, diffDays(d, first) + 3);
    const vals = dates.map((k) => S.weights.w[k]);
    let lo = Math.min(goal, sw - 0.8 * 12), hi = sw;
    if (vals.length) { lo = Math.min(lo, Math.min.apply(null, vals)); hi = Math.max(hi, Math.max.apply(null, vals)); }
    lo = Math.floor(lo - 0.5); hi = Math.ceil(hi + 0.5);
    const X = (date) => Lm + (W - Lm - Rm) * (diffDays(date, first) / span);
    const Y = (kg) => Tm + (H - Tm - Bm) * ((hi - kg) / (hi - lo));
    const step = hi - lo > 12 ? 2 : 1;
    let g = "";
    for (let k = Math.ceil(lo / step) * step; k <= hi; k += step) g += '<line class="g" x1="' + Lm + '" x2="' + (W - Rm) + '" y1="' + Y(k).toFixed(1) + '" y2="' + Y(k).toFixed(1) + '"/><text class="ax" x="' + (Lm - 6) + '" y="' + (Y(k) + 4).toFixed(1) + '" text-anchor="end">' + k + "</text>";
    for (let w = 0; w <= 12; w += narrow ? 3 : 2) { const x = X(addDays(start, w * 7)); if (x <= W - Rm + 1) g += '<text class="ax" x="' + x.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + (lang === "he" ? "ש" : "W") + w + "</text>"; }
    const p0 = [], p1 = [];
    for (let w = 0; w <= 12; w++) { const x = X(addDays(start, w * 7)).toFixed(1); p0.push(x + "," + Y(sw - 0.4 * w).toFixed(1)); p1.unshift(x + "," + Y(sw - 0.8 * w).toFixed(1)); }
    let s = g + '<polygon class="band" points="' + p0.concat(p1).join(" ") + '"/>' +
      '<line class="goal" x1="' + Lm + '" x2="' + (W - Rm) + '" y1="' + Y(goal).toFixed(1) + '" y2="' + Y(goal).toFixed(1) + '"/><text class="goal-t" x="' + (W - Rm - 4) + '" y="' + (Y(goal) - 5).toFixed(1) + '" text-anchor="end">' + esc(t("goal")) + " " + goal + "</text>";
    if (diffDays(d, first) >= 0) s += '<line class="nowl" x1="' + X(d).toFixed(1) + '" x2="' + X(d).toFixed(1) + '" y1="' + Tm + '" y2="' + (H - Bm) + '"/>';
    dates.forEach((k) => { s += '<circle class="pt" r="3" cx="' + X(k).toFixed(1) + '" cy="' + Y(S.weights.w[k]).toFixed(1) + '"/>'; });
    const line = [];
    if (dates.length) for (let k = dates[0]; k <= d; k = addDays(k, 1)) { const a = avg7(k); if (a != null) line.push([X(k), Y(a), a]); }
    if (line.length) {
      const e = line[line.length - 1];
      s += '<polyline class="avg" points="' + line.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '"/><circle class="end" r="5" cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '"/>' +
        '<text class="lbl" x="' + Math.min(e[0] + 8, W - Rm - 34).toFixed(1) + '" y="' + (e[1] - 9).toFixed(1) + '">' + f1(e[2]) + "</text>";
    }
    return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t("chart_h")) + '">' + s + "</svg>";
  }
  function strengthRows() {
    const by = {};
    Object.keys(S.workouts.s).sort().forEach((k) => {
      const w = S.workouts.s[k];
      for (const ex in w.ex || {}) {
        if (!EX[ex]) continue;
        const sets = w.ex[ex].filter(setFilled); if (!sets.length) continue;
        const tr = EX[ex].track;
        const score = (s) => (tr === "wr" && s.w ? s.w * (1 + s.r / 30) : s.r);
        const best = sets.reduce((a, s) => (score(s) > score(a) ? s : a), sets[0]);
        (by[ex] = by[ex] || []).push({ date: w.date, best: best, score: score(best) });
      }
    });
    return Object.keys(by).map((ex) => {
      const a = by[ex], f = a[0], l = a[a.length - 1], tr = EX[ex].track;
      let ch = "–";
      if (a.length > 1) {
        const dlt = tr === "wr" && f.best.w ? ((l.score - f.score) / f.score) * 100 : l.score - f.score;
        const txt = tr === "wr" && f.best.w ? (dlt >= 0 ? "+" : "−") + Math.abs(Math.round(dlt)) + " %" : (dlt >= 0 ? "+" : "−") + Math.abs(dlt);
        ch = '<span class="' + (dlt > 0 ? "up" : dlt < 0 ? "down" : "") + '">' + N(txt) + "</span>";
      }
      return "<tr><td><b>" + L(EX[ex].n) + '</b></td><td class="n">' + N(fmtSet(f.best, tr)) + '</td><td class="n">' + N(fmtSet(l.best, tr)) + '</td><td class="n">' + ch + '</td><td class="n">' + a.length + "</td></tr>";
    }).join("");
  }
  function heatmap() {
    const start = sundayOf(S.settings.start), d = today();
    // days before the first thing ever logged here were not tracked: they stay neutral, never "missed"
    const logged = Object.keys(S.days.d).concat(Object.keys(S.weights.w), Object.keys(S.workouts.s).map((k) => k.split("|")[0])).sort();
    const from = logged.length ? logged[0] : d;
    let cells = "<span></span>", done = 0, due = 0;
    for (let w = 1; w <= 12; w++) cells += "<span>" + w + "</span>";
    for (let i = 0; i < 7; i++) {
      cells += "<span>" + DOW[lang][i] + "</span>";
      for (let w = 0; w < 12; w++) {
        const date = addDays(start, w * 7 + i), p = WEEK[i], ok = dayDone(date);
        const past = date < d && date >= from, isToday = date === d;
        if (past || isToday) { if (ok) done++; if (past || ok) due++; }
        cells += '<i class="k-' + p.kind + (ok ? " done" : past ? " miss" : "") + (isToday ? " now" : "") + '" title="' + esc(dShort(date)) + '"></i>';
      }
    }
    return { html: '<div class="heat">' + cells + "</div>", done: done, due: due };
  }

    const entry = '<section class="card"><h3>' + t("add_entry") + '</h3><form class="inline-form" data-form="weight"><div class="field"><label for="we-date">' + t("date") + '</label><input class="inp" type="date" id="we-date" value="' + d + '" max="' + d + '"></div><div class="field"><label for="we-kg">' + t("weight") + ", " + t("kg") + '</label><input class="inp" id="we-kg" inputmode="decimal" autocomplete="off"></div><button class="btn btn-primary" type="submit">' + t("save") + "</button></form>" +
      (dates.length ? '<span class="label">' + t("recent") + '</span><ul class="entries">' + dates.map((k) => "<li><span>" + dShort(k) + "</span><b>" + N(f1(S.weights.w[k])) + " " + t("kg") + '</b><button data-action="del-weight" data-d="' + k + '">' + t("del") + "</button></li>").join("") + "</ul>" : "") + "</section>";
    const wd = Object.keys(S.weights.waist).sort().reverse().slice(0, 5);
    const waist = '<section class="card"><h3>' + t("waist_h") + '</h3><p class="small muted">' + t("waist_p") + '</p><form class="inline-form" data-form="waist"><div class="field"><label for="wa-cm">' + t("waist_h") + ", " + t("cm") + '</label><input class="inp" id="wa-cm" inputmode="decimal" autocomplete="off"></div><button class="btn btn-primary" type="submit">' + t("save") + "</button></form>" +
      (wd.length ? '<ul class="entries">' + wd.map((k) => "<li><span>" + dShort(k) + "</span><b>" + N(f1(S.weights.waist[k])) + " " + t("cm") + '</b><button data-action="del-waist" data-d="' + k + '">' + t("del") + "</button></li>").join("") + "</ul>" : "") + "</section>";
    const sr = strengthRows();
    const strength = '<section class="sec"><div class="sec-head"><h2>' + t("strength_h") + "</h2><p>" + t(sr ? "strength_p" : "strength_empty") + "</p></div>" +
      (sr ? '<div class="table-wrap"><table><thead><tr><th>' + t("exercise") + '</th><th class="n">' + t("first") + '</th><th class="n">' + t("latest") + '</th><th class="n">' + t("change_c") + '</th><th class="n">' + t("sessions_c") + "</th></tr></thead><tbody>" + sr + "</tbody></table></div>" : "") + "</section>";
    const hm = heatmap();
    const adh = '<section class="card"><h3>' + t("adh_h") + '</h3><p class="small muted">' + t("adh_p") + "</p>" + hm.html + '<div class="legend"><span><i class="done"></i>' + t("strength") + '</span><span><i class="done walk"></i>' + t("walk") + '</span><span><i class="miss"></i>' + t("lg_miss") + "</span><span><i></i>" + t("lg_future") + "</span></div>" +
      '<p class="small"><b>' + t("adh_sum", { n: hm.done, t: hm.due }) + "</b></p></section>";
    return '<section class="sec"><div class="sec-head"><h2>' + t("nav.progress") + "</h2></div>" + stats + "</section>" + verdictCard(tr, true) +
      '<div class="grid2"><div class="sec">' + chart + adh + '</div><div class="sec">' + entry + waist + "</div></div>" + strength;
  }

  ];
  function vPlan() {
    const st = status(), s = S.settings;
    const phases = '<div class="grid2">' + PHASES.map((p) => '<section class="card phasecard' + (st.state === "on" && p === st.phase ? " is-now" : "") + '"><p class="eyebrow">' + t("week_n", { w: N(p.from === p.to ? p.from : p.from + "–" + p.to) }) + "</p><h3>" + L(p.name) + "</h3><p>" + L(p.sum) + '</p><div class="kv"><span>' + t("rir", { r: "<b>" + N(p.rir) + "</b>" }) + "</span><span>" + t("steps") + ": <b>" + N(fmt(p.steps)) + "</b></span><span>" + t("incline") + ": <b>" + N(p.incline + " %") + "</b></span></div></section>").join("") + "</div>";
    let rows = "";
    for (let w = 1; w <= PROGRAM.weeks; w++) { const p = phaseOf(w); rows += '<tr class="' + (st.state === "on" && w === st.week ? "is-now" : "") + '"><td class="n"><b>' + w + "</b></td><td>" + L(p.name) + '</td><td class="n">' + N(p.rir) + "</td><td>" + L(WEEK_FOCUS[w - 1]) + '</td><td class="n">' + fmt(p.steps) + '</td><td class="n">' + p.incline + " %</td></tr>"; }
    const road = '<div class="table-wrap"><table><thead><tr><th class="n">' + t("th_week") + "</th><th>" + t("th_phase") + '</th><th class="n">' + t("th_rir") + "</th><th>" + t("th_focus") + '</th><th class="n">' + t("th_steps") + '</th><th class="n">' + t("th_incl") + "</th></tr></thead><tbody>" + rows + "</tbody></table></div>";
    const rules = '<section class="card"><h3>' + t("rules2_h") + '</h3><ol class="olist">' + ["rule_measure", "rule_waist", "rule_slow", "rule_fast", "rule_strength"].map((k) => "<li>" + t(k) + "</li>").join("") + "</ol></section>";
    const gear = '<div class="gear">' + Object.keys(EQ).map((k) => '<figure class="gearcard"><div class="plate">' + ill(k) + "</div><figcaption><b>" + L(EQ[k]) + "</b><span>" + L(EQ_USE[k]) + "</span></figcaption></figure>").join("") + "</div>";
    const walls = { BENCH: "קיר הספסל", DOOR: "קיר הדלת", WINDOW: "קיר החלון", MIRROR: "קיר המראה" };
    const roomSvg = lang === "he" ? ROOM_SVG.replace(/>(BENCH|DOOR|WINDOW|MIRROR) WALL</g, (m, w) => ">" + walls[w] + "<") : ROOM_SVG;
    const room = '<div class="roomwrap roomplan">' + roomSvg + '<ul class="roomkey">' + ROOM_KEY.map((r) => "<li><b" + (r[2] ? ' class="o"' : "") + ">" + r[0] + "</b>" + L(r[1]) + "</li>").join("") + "</ul></div>";
    const settings = '<section class="card" id="settings"><h3>' + t("settings_h") + '</h3><div class="grid2 settings" style="display:grid">' +
      '<div class="field"><label for="s-start">' + t("s_start") + '</label><input class="inp" type="date" id="s-start" data-set="start" value="' + s.start + '"></div>' +
      '<div class="field"><label for="s-startw">' + t("s_startw") + '</label><input class="inp" id="s-startw" data-set="startWeight" inputmode="decimal" value="' + s.startWeight + '"></div>' +
      '<div class="field"><label for="s-goal">' + t("s_goal") + '</label><input class="inp" id="s-goal" data-set="goal" inputmode="decimal" value="' + s.goal + '"></div>' +
      '<div class="field"><label for="s-maxdb">' + t("s_maxdb") + '</label><input class="inp" id="s-maxdb" data-set="maxDb" inputmode="decimal" value="' + s.maxDb + '"></div>' +
      '<p class="small muted full" id="sync-text">' + syncText() + "</p>" +
      (FBC ? '<div class="field full"><label for="share-link">' + t("link_h") + '</label><input class="inp" id="share-link" dir="ltr" readonly value="' + esc(shareLink()) + '"><p class="small muted">' + t("link_p") + '</p></div><div class="btn-row full"><button class="btn btn-ghost btn-sm" data-action="copy-link">' + t("link_copy") + "</button></div>" : "") +
      (FBM && Auth.user ? '<div class="btn-row full"><button class="btn btn-ghost btn-sm" data-action="sign-out">' + t("sign_out") + "</button></div>" : "") +
      '<div class="btn-row full"><button class="btn btn-ghost btn-sm" data-action="export">' + t("export") + "</button>" +
      (ui.confirmReset ? '<button class="btn btn-danger btn-sm" data-action="reset-yes">' + t("reset_confirm") + '</button><button class="btn btn-ghost btn-sm" data-action="reset-no">' + t("cancel") + "</button>" : '<button class="btn btn-ghost btn-sm" data-action="reset">' + t("reset") + "</button>") + "</div>" +
      '<button class="btn btn-ghost btn-sm" data-action="import">' + t("import") + "</button>" +
      '<textarea class="inp full" id="export-box" rows="4" readonly hidden></textarea>' +
      (ui.importOpen ? '<div class="field full"><label for="import-box">' + t("import_p") + '</label><textarea class="inp" id="import-box" rows="5" autocomplete="off" spellcheck="false"></textarea></div><div class="btn-row full"><button class="btn btn-primary btn-sm" data-action="import-apply">' + t("import_apply") + '</button><button class="btn btn-ghost btn-sm" data-action="import">' + t("cancel") + "</button></div>" : "") +
      "</div></section>";
    return '<section class="sec"><div class="sec-head"><h2>' + t("road_h") + "</h2><p>" + t("road_p") + "</p></div>" + phases + road + "</section>" + rules +
      '<section class="sec"><div class="sec-head"><h2>' + t("gear_h") + "</h2></div>" + gear + "</section>" +
      '<section class="sec"><div class="sec-head"><h2>' + t("room_h") + "</h2><p>" + t("room_p") + "</p></div>" + room + "</section>" + settings +
      '<footer class="foot"><p>' + t("disclaimer") + "</p><p>" + t("credit") + "</p></footer>";
  }

  /* ---------- render ---------- */
  const VIEWS = { today: vToday, train: vTrain, eat: vEat, progress: vProgress, plan: vPlan };
  const ICONS = {
    today: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
    train: '<path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/>',
    eat: '<path d="M6 3v7a2 2 0 0 0 4 0V3M8 12v9M17 3c-2 1-3 3.5-3 6s1 3 3 3v9"/>',
    progress: '<path d="M3 20h18M6 16l4-5 4 3 5-8"/><circle cx="19" cy="6" r="1.6"/>',
    plan: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  };
  function renderShell() {
    $("#brand").textContent = t("brand");
    const st = status();
    $("#brand-sub").textContent = st.state === "on" ? t("week_n", { w: st.week }) + " " + t("of_12") + " · " + L(st.phase.name) : st.state === "before" ? t("before_h") : t("after_h");
    $("#lang").textContent = lang === "he" ? "EN" : "עברית";
    $("#lang").setAttribute("aria-label", lang === "he" ? "Switch to English" : "החלף לעברית");
    $("#nav").innerHTML = Object.keys(VIEWS).map((v) => '<button data-view="' + v + '"' + (ui.view === v ? ' aria-current="page"' : "") + '><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[v] + "</svg><span>" + t("nav." + v) + "</span></button>").join("");
    setSync(Cloud.status);
    document.title = t("brand");
  }
  function render() {
    renderShell();
    const gate = FBM && !Auth.user;
    document.body.classList.toggle("need-login", gate);
    $("#view").innerHTML = gate ? vLogin() : VIEWS[ui.view]();
    pendingRender = false;
  }
  let pendingRender = false;
  function softRender() {   // data arrived from another device: don't yank an input someone is typing in
    const a = document.activeElement;
    if (a && a.closest && a.closest("#view") && /INPUT|TEXTAREA/.test(a.tagName)) { pendingRender = true; return; }
    render();
  }
  function go(view, top) {
    ui.view = view; ui.openSlot = null; ui.confirmReset = false;
    try { localStorage.setItem(LS + "-view", view); } catch (e) { /* ignore */ }
    render();
    if (top !== false) window.scrollTo(0, 0);
  }
  let toastT = null;
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

  /* ---------- rest timer ---------- */
  const timer = { end: 0, iv: null, ctx: null };
  function beep() {
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      timer.ctx = timer.ctx || new C();
      const o = timer.ctx.createOscillator(), g = timer.ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(timer.ctx.destination);
      g.gain.setValueAtTime(0.0001, timer.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, timer.ctx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, timer.ctx.currentTime + 0.5);
      o.start(); o.stop(timer.ctx.currentTime + 0.55);
    } catch (e) { /* sound is optional */ }
  }
  function primeAudio() { try { const C = window.AudioContext || window.webkitAudioContext; if (C) { timer.ctx = timer.ctx || new C(); if (timer.ctx.state === "suspended") timer.ctx.resume(); } } catch (e) { /* optional */ } }
  function tick() {
    const left = Math.ceil((timer.end - Date.now()) / 1000), el = $("#timer");
    if (left <= 0) {
      clearInterval(timer.iv); timer.iv = null; beep();
      el.classList.add("is-go"); $("#timer-n").textContent = "0:00"; $("#timer-l").textContent = t("go");
      setTimeout(() => { if (!timer.iv) { el.hidden = true; document.body.classList.remove("has-timer"); } }, 3000);
      return;
    }
    $("#timer-n").textContent = Math.floor(left / 60) + ":" + pad(left % 60);
  }
  function startTimer(sec) {
    if (!sec) return;
    primeAudio();
    timer.end = Date.now() + sec * 1000;
    const el = $("#timer"); el.hidden = false; el.classList.remove("is-go"); document.body.classList.add("has-timer");
    $("#timer-l").textContent = t("rest_t"); $("#timer-skip").textContent = t("skip");
    clearInterval(timer.iv); timer.iv = setInterval(tick, 250); tick();
  }
  function stopTimer() { clearInterval(timer.iv); timer.iv = null; $("#timer").hidden = true; document.body.classList.remove("has-timer"); }

  /* ---------- logging helpers ---------- */
  function readSet(row) {
    const logEl = row.closest(".log"), ex = logEl.dataset.ex, sid = logEl.dataset.sid, i = +row.dataset.i;
    const st = status(), w = ensureW(today(), sid, ui.block || st.phase.block);
    const arr = w.ex[ex] = w.ex[ex] || [];
    while (arr.length <= i) arr.push({});
    const s = {};
    $$("input", row).forEach((inp) => { const v = num(inp.value); if (v != null && v >= 0) s[inp.dataset.f] = v; });
    arr[i] = s;
    row.classList.toggle("is-done", setFilled(s));
    save("workouts");
    const pr = $("#sess-progress");
    if (pr) pr.textContent = t("sets_logged", { n: $$("#view .set.is-done").length, t: pr.dataset.total });
    return s;
  }
  function saveWeight(date, raw) {
    const v = num(raw);
    if (v == null || v < 30 || v > 250) { toast(t("bad_number")); return false; }
    S.weights.w[date] = Math.round(v * 10) / 10; save("weights"); toast(t("saved")); return true;
  }
  function setMeals(mut) {
    const d = today(), type = ui.dayType || dayType(d), m = clone(mealsFor(d, type));
    m.type = type; m.x = m.x || []; mut(m);
    dayRec(d, true).meals = m; save("days");
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-view]");
    if (nav) { e.preventDefault(); go(nav.dataset.view); return; }
    const el = e.target.closest("[data-action]"); if (!el) return;
    const a = el.dataset.action, d = today();
    if (a === "lang") { S.settings.lang = lang === "he" ? "en" : "he"; save("settings"); pickLang(); render(); }
    else if (a === "goto-settings") { go("plan", false); const s = $("#settings"); if (s) s.scrollIntoView(); }
    else if (a === "open-session") { ui.dow = WEEK.findIndex((p) => p.sid === el.dataset.sid); ui.block = status().phase.block; go("train"); }
    else if (a === "open-walks") { const td = parse(d).getDay(); ui.dow = WEEK[td].kind !== "lift" ? td : 1; go("train"); }
    else if (a === "toggle-session") { const r = dayRec(d, true); r.c.session = !r.c.session; save("days"); render(); }
    else if (a === "pick-day") { ui.dow = +el.dataset.dow; render(); }
    else if (a === "pick-block") { ui.block = el.dataset.v; render(); }
    else if (a === "set-ok") {
      const row = el.closest(".set");
      $$("input", row).forEach((inp) => { if (!inp.value.trim() && inp.placeholder) inp.value = inp.placeholder; });
      const s = readSet(row);
      if (!setFilled(s)) { const r = $('input[data-f="r"]', row); if (r) r.focus(); return; }
      startTimer(+row.closest(".log").dataset.rest);
    }
    else if (a === "finish") {
      const w = ensureW(d, ui.sid, ui.block); w.done = true; save("workouts");
      if (dayPlan(d).sid === ui.sid) { dayRec(d, true).c.session = true; save("days"); }
      stopTimer(); render(); toast(t("finished"));
    }
    else if (a === "timer-add") { timer.end += 15000; tick(); }
    else if (a === "timer-skip") stopTimer();
    else if (a === "daytype") { ui.dayType = el.dataset.v; ui.openSlot = null; render(); }
    else if (a === "open-slot") { ui.openSlot = ui.openSlot === el.dataset.slot ? null : el.dataset.slot; render(); }
    else if (a === "pick-meal") { setMeals((m) => { m[el.dataset.slot] = el.dataset.id; }); ui.openSlot = null; render(); }
    else if (a === "addon") { setMeals((m) => { const i = m.x.indexOf(el.dataset.id); if (i >= 0) m.x.splice(i, 1); else m.x.push(el.dataset.id); }); render(); }
    else if (a === "preset") { const r = dayRec(d, false); if (r && r.meals) { delete r.meals; save("days"); } ui.openSlot = null; render(); }
    else if (a === "adj") { S.settings.kcalAdj = clamp((S.settings.kcalAdj || 0) + (+el.dataset.v), -450, 450); save("settings"); render(); toast(t("saved")); }
    else if (a === "del-weight") { delete S.weights.w[el.dataset.d]; save("weights"); render(); }
    else if (a === "del-waist") { delete S.weights.waist[el.dataset.d]; save("weights"); render(); }
    else if (a === "export") {
      const txt = JSON.stringify({ exported: d, data: S }, null, 1), box = $("#export-box");
      const show = () => { box.hidden = false; box.value = txt; box.focus(); box.select(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t("copied")), show); else show();
    }
    else if (a === "import") { ui.importOpen = !ui.importOpen; render(); if (ui.importOpen) { const b = $("#import-box"); if (b) b.focus(); } }
    else if (a === "import-apply") {
      let parsed = null;
      try { parsed = JSON.parse($("#import-box").value); } catch (err) { parsed = null; }
      const data = parsed && parsed.data;
      if (!data || typeof data !== "object" || !data.settings || !DOCS.some((n) => data[n] && n !== "settings")) { toast(t("import_bad")); return; }
      DOCS.forEach((n) => { S[n] = withDefaults(n, data[n]); save(n); });
      ui.importOpen = false; pickLang(); render(); toast(t("import_done"));
    }
    else if (a === "copy-link") {
      const box = $("#share-link"), txt = shareLink();
      const sel = () => { if (box) { box.focus(); box.select(); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t("copied")), sel); else sel();
    }
    else if (a === "auth-up") authDo("up");
    else if (a === "auth-reset") authDo("reset");
    else if (a === "sign-out") {
      stopSync(); DOCS.forEach((n) => { S[n] = clone(DEFAULTS[n]); }); dirty = {};
      try { localStorage.removeItem(LS); } catch (err) { /* ignore */ }
      window.FB.signOut().catch(() => {}); Auth.user = null; go("today");
    }
    else if (a === "reset") { ui.confirmReset = true; render(); }
    else if (a === "reset-no") { ui.confirmReset = false; render(); }
    else if (a === "reset-yes") {
      const keep = S.settings.lang;
      DOCS.forEach((n) => { S[n] = clone(DEFAULTS[n]); if (n === "settings") S[n].lang = keep; save(n); });
      ui.confirmReset = false; render(); toast(t("reset_done"));
    }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.habit) {
      const r = dayRec(today(), true); r.c[el.dataset.habit] = el.checked; save("days");
      const sc = $("#habit-score"); if (sc) sc.textContent = t("of_done", { n: $$(".habits input:checked").length, t: HABITS.length });
      if (el.dataset.habit === "session") render();
    } else if (el.dataset.f && el.closest(".set")) readSet(el.closest(".set"));
    else if (el.dataset.set) {
      const k = el.dataset.set;
      if (k === "start") { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { S.settings.start = el.value; ui.block = null; } }
      else { const v = num(el.value); if (v == null || v <= 0) { toast(t("bad_number")); el.value = S.settings[k]; return; } S.settings[k] = v; }
      save("settings"); renderShell(); toast(t("saved"));
    }
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.dataset.form; if (!f) return;
    e.preventDefault();
    if (f === "login") { authDo("in"); return; }
    if (f === "weight-today") { if (saveWeight(today(), $("#w-today").value)) render(); }
    else if (f === "weight") { const dt = $("#we-date").value || today(); if (dt <= today() && saveWeight(dt, $("#we-kg").value)) render(); }
    else if (f === "waist") { const v = num($("#wa-cm").value); if (v == null || v < 40 || v > 200) { toast(t("bad_number")); return; } S.weights.waist[today()] = Math.round(v * 10) / 10; save("weights"); toast(t("saved")); render(); }
  });
  document.addEventListener("focusout", () => { if (pendingRender) setTimeout(() => { if (pendingRender) softRender(); }, 50); });

  /* ---------- start ---------- */
  loadLocal();
  pickLang();
  const hash = (location.hash || "").replace("#", "");
  if (VIEWS[hash]) ui.view = hash;
  if (!VIEWS[ui.view]) ui.view = "today";
  render();
  if (FBC) initLinkSync(); else if (FBM) initFirebase(); else initCloud();
  if (window.__STANDALONE && "serviceWorker" in navigator && /^https:|localhost|127\.0\.0\.1/.test(location.href)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => { /* offline cache is optional */ }); });
  }
  window.__app = { code: () => CODE, auth: Auth, state: () => S, ui: ui, render: render, trend: trend, status: status, cloud: Cloud };
})();

</script>
</body></html>
